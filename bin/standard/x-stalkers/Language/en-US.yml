  STR_ANOMALY_DEAL: "ANOMALY SITE (Deal)"
  STR_ANOMALY_NOBODY_BRIEFING: "Looks like you got here first. Stay sharp though, someone could show up any minute now. When they do, take them down. Otherwise collect the artifacts and get out of here.{NEWLINE}{NEWLINE}This mission will NOT end when all enemies are eliminated. Get in, grab the loot and get out."
  STR_ANOMALY_WALKA_BRIEFING: "A group of stalkers beat you to this site. They don't look like they want to negotiate. Take them down and collect the artifacts.{NEWLINE}{NEWLINE}To disengage, move remaining stalkers to the starting area and abort the mission."
  STR_ANOMALY_POMAGAJ_BRIEFING: "You arrive at the site and notice a group of stalkers fighting for their lives. Help them out and they will share the artifacts with you.{NEWLINE}{NEWLINE}To disengage, move remaining stalkers to the starting area and abort the mission."
  STR_ANOMALY_DEAL_BRIEFING: "After arriving to this site you meet a group of stalkers. You decided to share the artifacts and part ways peacefully.{NEWLINE}{NEWLINE}No battle this time; just end the turn."
  STR_ANOMALY_BEAST_BRIEFING: "A large pack of animals gathered on this site. Other than that, there are no other stalkers to compete us for the artifacts.{NEWLINE}{NEWLINE}To complete the mission, either eliminate all enemies or bring the artifacts to the starting point and abort mission."
  STR_ANOMALY_SITE_BRIEFING: "Your main concern is to gather artifacts. Approach the anomaly site, gather the artifacts, return your stalkers to the starting point and abort mission."
  STR_TENT: "Tent"
  STR_STALKER: "Stalker"
  STR_CREATURES: "Mutants"
  STR_ANOMALY_DEPLOYMENT: "Anomalion"
  STR_BLINDDOG: "Blind Dog"
  STR_BLINDDOG_UC: "Blind Dog"
  STR_BLINDDOG_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}\t\tBlind dogs have developed a sense, which allows them to navigate around anomalies an environment with ease. They are able to sense other animals and humans through walls."
  STR_BLINDDOG_CORPSE: "Dead Blind Dog"
  BLINDDOG_WEAPON: "Blind Dog Bite"
  BLINDDOG_WEAPON_KNOWLEDGEBASE: "\t\tDogs' primary fighting style."
  STR_SUCKER: "Bloodsucker"
  STR_SUCKER_UC: "Bloodsucker"
  STR_SUCKER_KNOWLEDGEBASE: "\t\tRumour says that these things are result of a failed supersoldier formula experiments. Their skin can change colours and camouflage them, making them almost invisible from afar. Our stalkers have a random chance of spotting them from distance. The odds are improved by high reactions."
  STR_SUCKER_CORPSE: "Dead Bloodsucker"
  SUCKER_WEAPON: "Bloodsucker Bite"
  SUCKER_WEAPON_KNOWLEDGEBASE: "\t\tBloodsucker aims for the face and neck with its tentacles. It's saliva causes nausiness and unease, represented by damage done to TU of a victim. Wearing face protection will make it harder for them to attack."
  STR_USE: "Use"
  STR_THE_ZONE: "The Zone"
  STR_ANOMALY_SITE: "ANOMALY SITE"
  STR_BANDIT_LEADER_SPILLED_BEANS: "Bandit leader has spilled the beans"
  STR_STALKER_EXPERIENCED_SAID_ENOUGH: "Experienced stalker said enough"
  STR_NOWWHAT: "We're in, now what?"
  STR_NOWWHAT1: "We're in, now what? [Pt. 1 - The Situation]"
  STR_NOWWHAT2: "We're in, now what? [Pt. 2 - The Money]"
  STR_NOWWHAT3: "We're in, now what? [Pt. 3 - The Strategy]"
  STR_NOWWHAT_KNOWLEDGEBASE1: "\t\tAllright, we moved in, hanged the \"Home sweet home\" thingy on the wall, our smuggling network for trading with the outside world is up and running, everything is fine and all that, but now let's get down to business.{NEWLINE}{NEWLINE}\t\tOur long term goal is going to be to reach the center of the Zone. The rarest Artifacts, the Wishgranter, maybe the source of Anomalies that can be turned off; Whatever your plan for the Zone is, it starts at the center. However it is blocked off by the Brainscorcher - some sort of psionic emission that will zombify anyone who gets near. Finding a way around it would be a major milestone, but so far it is impossible for two reasons. One - the Brainscorcher is too strong for any forms of psionic protection currently know in the Zone. Maybe combining medicine, artifacts and experimental equipment would migitate it enough to survive one raid, but nobody got an opportunity for testing due to reason number two - Monolit. Monolit is a faction of stalkers fanatically defending the scorcher and center of the Zone."
  STR_NOWWHAT_KNOWLEDGEBASE2: "\t\tBut let's not worry about that yet, we have plenty of time to figure it out. For now, let's focus on more important issue - money. Our savings will run out eventually, so we gotta find source of income. In the Zone, the most obvious choice is Artifact hunting. Artifacts are being spawned by Anomaly Sites, which randomly occur all around the Zone. They may occur at any time, but few times per month a Blowout occurs, and it causes a huge burst of Anomaly Sites.{NEWLINE}{NEWLINE}\t\tBesides artifact hunting, we can get busy with traditional hunting. There's plenty of mutants to go around, and there's plenty of trophy collectors and researchers who are buying these.{NEWLINE}{NEWLINE}\t\tAnother way to make a living is... well... mug other stalkers. You see, shooting at Bandits or fending off random looters is one thing, but if we start hunting down random stalkers just walking around the Zone and minding their own business, our reputation will take a hit."
  STR_NOWWHAT_KNOWLEDGEBASE3: "\t\tWe won't achieve much just by sitting in our base, looking out the window and waiting until anything interesting happens. We should send out some expeditions into the field and have them looking for opportunities. The more area we manage to cover, the more likely we are to spot anything noteworthy. But careful where you send our guys - some regions are more dangerous than others. Our rookies should spend some time in the outskirts of the Zone until they get some experience, and until we can provide them with some better survival gear than just PMs and vodka.{NEWLINE}{NEWLINE}\t\tNote that we don't have to engage in every encounter. Doesn't matter if it's because the enemy is outgunning us, or is too obnoxious to deal with. We can do whatever, as long as we have enough money to afford our monthly cost."
  STR_EXPEDITIONS: "Expeditions"
  STR_ANIMAL: "Animal"
  STR_STEAL_CHEAP_KEVLAR: "Steal bandit's cheap kevlar"
  STR_STEAL_BANDIT_COBRA: "Steal bandit's Cobra vest"
  STR_STEAL_STALKER_SUNRISE: "Steal stalker's Sunrise armor"
  STR_STEAL_STALKER_HEAVYSUNRISE: "Steal stalker's Heavy Sunrise armor"
  STR_STEAL_MONOLIT_BERYL: "Steal Monolit's Beryl armor"
  STR_STEAL_MONOLIT_EXO: "Steal Monolit's Exoskeleton"
  STR_SKILLS: "Skills"
  STR_DOG_NEST: "DOG NEST"
  STR_DOG_NEST_: "DOG NEST-{0}"
  STR_DOG_NEST_BRIEFING: "You arrived at the cave where huge pack of Blind Dogs live. Destroy this nest by eliminating them.{NEWLINE}{NEWLINE}To disengage, move remaining stalkers to the starting area and abort the mission."
  STR_BITE: "Bite"
  STR_ANOMALIES1: "Anomalies survival guide [Pt. 1 - Definition]"
  STR_ANOMALIES2: "Anomalies survival guide [Pt. 2 - Discharge]"
  STR_ANOMALIES3: "Anomalies survival guide [Pt. 3 - Spotting]"
  STR_ANOMALIES4: "Anomalies survival guide [Pt. 4 - Random Factor]"
  STR_ANOMALIES_KNOWLEDGEBASE1: "\t\tAn anomaly is a strange phenomenon unexplainable by laws of physics occuring in an era of 2 meters on average. Such phenomena include gravitational disturbance, abnormally high temperature with no identifiable heat source, very acidic PH index, to name a few.{NEWLINE}{NEWLINE}\t\tWhen 'disturbed', most anomalies will violently discharge a burst of energy in form adequate to their type. For instance, gravitational anomalies will release a shockwave, or create gravitational force."
  STR_ANOMALIES_KNOWLEDGEBASE2: "\t\tEvents which provoke a discharge include:{NEWLINE}\t- Entering the anomaly's proximity{NEWLINE}\t- Standing in the anomaly's proximity at the beginning of a turn{NEWLINE}\t- Throwing an item into the anomaly's proximity{NEWLINE}\t- Explosion{NEWLINE}\t- Discharge of neighbouring anomaly{NEWLINE}{NEWLINE}\t\tMost anomalies discharge only once per turn, but there are exceptions." 
  STR_ANOMALIES_KNOWLEDGEBASE3: "\t\tAnomalies are not visible on the battlescape right away, and have to be discoved by a stalker in similar way enemy units do. In addition to line of sight requirement, most anomaly types also require being close enough and/or have random chance of being spotted."
  STR_ANOMALIES_KNOWLEDGEBASE4: "\t\tChance of spotting an anomaly is calculated from formula {ALT}BASE CHANCE * REACTIONS{ALT}, where base chance depends on the anomaly. The roll is being done when moving a tile and when turning around. One may invest TUs in rotating in place to carefully examine an area ahead without risk."
  STR_ANOMALY_SPRINGBOARD: "Springboard"
  STR_ANOMALY_SPRINGBOARD_DUMMY: "Springboard"
  STR_ANOMALY_SPRINGBOARD_KNOWLEDGEBASE: "Spot chance:{NEWLINE}\t\t{ALT}37% (DAY) / 20% (NIGHT){ALT}{NEWLINE}Spot range:{NEWLINE}\t\t{ALT}5 (DAY) / 4 (NIGHT){ALT}{NEWLINE}{NEWLINE}\t\tMost common anomaly in the Zone. Difficult to spot, impossible to see from afar. When provoked, discharges a shockwave that gives a concussion, but usually doesn't kill."
  STR_ANOMALY_VORTEX: "Vortex"
  STR_ANOMALY_VORTEX_DUMMY: "Vortex"
  STR_ANOMALY_VORTEX_KNOWLEDGEBASE: "Spot chance: {ALT}33%{ALT}{NEWLINE}Spot range: {ALT}DEFAULT{ALT}{NEWLINE}Provoke range: {ALT}3{ALT}{NEWLINE}{NEWLINE}\t\tEspecially dangerous gravitational anomaly. Can be identified by leaves and dust whirling in the air around its center. When discharged, creates a gravitational pull towards its center, tearing apart whatever gets sucked in."
  STR_ANOMALY_KVASS: "Kvass"
  STR_ANOMALY_KVASS_DUMMY: "Kvass"
  STR_ANOMALY_KVASS_KNOWLEDGEBASE: "Spot chance: {ALT}GUARANTEED{ALT}{NEWLINE}Spot range: {ALT}DEFAULT{ALT}{NEWLINE}{ALT}Discharges more than once per turn.{ALT}{NEWLINE}{NEWLINE}\t\tCan be recognized by green tint. When discharging, it creates corrosive droplets. Contact with skin leads to serious burns. Easily corrodes most armors, lowering their effectiveness."
  STR_ANOMALY_ELECTRO: "Electro"
  STR_ANOMALY_ELECTRO_DUMMY: "Electro"
  STR_ANOMALY_ELECTRO_KNOWLEDGEBASE: "Spot chance: {ALT}10%{ALT}{NEWLINE}Spot range: {ALT}DEFAULT{ALT}{NEWLINE}Provoke range: {ALT}2{ALT}{NEWLINE}{NEWLINE}\t\tThis one is treacherous. Almost unnoticable, apart from occasional small spark, which can be seen even from a distance. Usually only occurs around metal objects (pipes, cars and such), power lines or old electronics, but may still rarely occur randomly in the open, especially on anomaly sites. Contact causes painful electrocution and may paralyze, preventing the victim from running away."
  STR_ANOMALY_BURNER: "Burner"
  STR_ANOMALY_BURNER_DUMMY: "Burner"
  STR_ANOMALY_BURNER_KNOWLEDGEBASE: "Spot chance:{NEWLINE}\t\t{ALT}100% (DAY) / GUARANTEED (NIGHT){ALT}{NEWLINE}Spot range:{NEWLINE}\t\t{ALT}3 (DAY) / DEFAULT (NIGHT){ALT}{NEWLINE}{NEWLINE}\t\tIt is invisible in the daylight, but it can be spotted from up close by increased heat it emits. In the dark it is easy to spot as it emits dim light. When provoked it releases accumulated heat, causing severe burns and often starting a fire."
  STR_DETECTOR_BASIC: "Basic Anomaly Detector"
  STR_DETECTOR_BASIC_KNOWLEDGEBASE: "Spot chance:{NEWLINE}\t\t{ALT}40% (HAND) / 30% (BELT){ALT}{NEWLINE}Spot range:{NEWLINE}\t\t{ALT}5 (HAND) / 2 (BELT){ALT}{NEWLINE}{NEWLINE}\t\tHomemade detector made of spare radio parts. Can detect anomalies when equipped in either hand or belt. Detection rolls for detector are done independently from detection rolls for the stalker holding it."
  STR_DETECTOR_ADV: "Advanced Anomaly Detector"
  STR_DETECTOR_ADV_UC: "Advanced Anomaly Detector article"
  STR_DETECTOR_ADV_KNOWLEDGEBASE: "Spot chance:{NEWLINE}\t\t{ALT}50% (HAND) / 40% (BELT){ALT}{NEWLINE}Spot range:{NEWLINE}\t\t{ALT}8 (HAND) / 5 (BELT){ALT}{NEWLINE}{NEWLINE}\t\tMore advanced detection device. When equipped on belt it's just as effective as basic detector in hand. Very expensive."
  MAP_DARKFOREST: "Dark forest"
  MAP_DARKFORESTPSI: "Dark forest (psi emitter)"
  MAP_MIASTO: "Urban"
