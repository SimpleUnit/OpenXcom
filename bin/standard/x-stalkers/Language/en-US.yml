  STR_GRENADE_WP_KNOWLEDGEBASE: "\t\tThis one is for Bulldog and for attachment to:{NEWLINE}\t- Service rifle{NEWLINE}\t- Modernized rifle{NEWLINE}\t- Thunder rifle"
