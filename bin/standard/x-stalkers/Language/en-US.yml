en-US:
  STR_OPENXCOM: "X-Stalkers{ALT}"
  STR_LOST_IN_SERVICE: "LOST IN THE ZONE"
  STR_AVATAR_NAME_1: "Adidas"
  STR_AVATAR_NAME_2: "Everlast"
  STR_AVATAR_NAME_3: "Gracjan"
  STR_AVATAR_NAME_4: "Skolwin"
  STR_AVATAR_NAME_5: "Maska"
  STR_AVATAR_NAME_6: "Jasny"
  STR_AVATAR_NAME_7: "Bandyta"
  STR_AVATAR_NAME_8: "Rybak"
  STR_1_BEGINNER: "1> Casual"
  STR_2_EXPERIENCED: "2> Easier"
  STR_3_VETERAN: "3> Regular"
  STR_4_GENIUS: "4> Challenging"
  STR_5_SUPERHUMAN: "5> Absurd"
  STR_DIFFICULTY0: "(difficulty 1 selected)"
  STR_DIFFICULTY1: "(difficulty 2 selected)"
  STR_DIFFICULTY2: "(difficulty 3 selected)"
  STR_DIFFICULTY3: "(difficulty 4 selected)"
  STR_DIFFICULTY4: "(difficulty 5 selected)"
  STR_NONE_UC: "None"
  STR_NONE_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tNo armor means no protection from bullets or hazards. Basic clothing only protects from bad weather."
  STR_BANDIT: "Bandit"
  STR_BANDIT_JACKET: "Bandit"
  STR_BANDIT_JACKET_KEVLAR: "Bandit (with cheap kevlar)"
  STR_BANDIT_JACKET_KEVLAR_UC: "Bandit (jacket)"
  STR_BANDIT_JACKET_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tBandits - ther're in the Zone to get rich. They're mostly criminals and gangers. Some of them are wearing cheap kevlars under their jackets."
  STR_BANDIT_HEAVY: "Bandit (with cobra)"
  STR_BANDIT_HEAVY_UC: "Bandit (with cobra)"
  STR_BANDIT_HEAVY_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tBandits at some point managed to get their hands on a batch of old Cobra vests, but are using them only for their turf defense."
  STR_BANDIT_COAT: "Bandit Leader"
  STR_BANDIT_COAT_UC: "Bandit (coat)"
  STR_BANDIT_COAT_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}\t\tBandit leaders - they are much more experienced and better informed than common grunts. Since they're higher in the hierarchy, they also get access to berrer equipment, including the armor."
  STR_MILITARY: "Military"
  STR_MILITARY_UC: "Military"
  STR_MILITARY_KNOWLEDGEBASE: "\t\tOfficially, the army is locking down the Zone and shooting on sight because stalking is illegal. Under the table, it does shady deals with stalkers and accepts bribes. Either way, better not to mess with these guys. Not only because they're well trained and equipped, but also they have the infinite power of government backing them."
  STR_MILITARY_SERGEANT: "Military sergeant"
  STR_MILITARY_SOLDIER: "Military soldier"
  STR_MERCENARY: "Mercenary"
  STR_MERCENARY_UC: "Mercenary"
  STR_MERCENARY_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}\t\tHighly trained stalkers carrying out various tasks for the highest bidder. They wear modernized Cobra vests supplemented with basic environment protection suits."
  STR_MONOLIT: "Monolit"
  STR_MONOLIT_ELITE: "Monolit elite"
  STR_MONOLIT_EXO: "Monolit soldier (with exoskeleton)"
  STR_MONOLIT_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}\t\tMonolit members are guarding the center of the Zone with limitless devotion. They know no fear. Their outfits have similar parameters to Sunrise rev. 5, except they're more resistant to fire and chemicals."
  STR_MONOLIT_SNIPER: "Monolit sniper"
  STR_MONOLIT_SOLDIER: "Monolit soldier"
  STR_MONOLIT_SOLDIER_PLUS: "Monolit soldier"
  STR_MONOLIT_UC: "Monolit soldier"
  STR_HEAVYMONOLIT: "Monolit soldier (with beryl)"
  STR_HEAVYMONOLIT_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}\t\tBetter skilled, better equipped and better armored. They're wearing Beryl that went through the same process that makes Monolit outfits more resistant to fire and chemicals."
  STR_HEAVYMONOLIT_PLUS: "Monolit soldier (with beryl)"
  STR_HEAVYMONOLIT_UC: "Monolit soldier (with beryl)"
  STR_STALKER_ROOKIE: "Stalker (rookie)"
  STR_STALKER_ROOKIE_NEUTRAL: "Neutral Stalker (rookie)"
  STR_STALKER_EXPERIENCED: "Stalker (experienced)"
  STR_STALKER_EXPERIENCED_NEUTRAL: "Neutral Stalker (experienced)"
  STR_STALKER_EXPERIENCED_PLUS: "Stalker (experienced)"
  STR_STALKER_EXPERIENCED_PLUS_NEUTRAL: "Neutral Stalker (experienced)"
  STR_HEAVYSTALKER_EXPERIENCED: "Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_NEUTRAL: "Neutral Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_PLUS: "Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_PLUS_NEUTRAL: "Neutral Stalker (with heavy sunrise, experienced)"
  STR_BANDIT_GRUNT: "Bandit grunt"
  STR_BANDIT_LEADER: "Bandit leader"
  STR_CHEAP_KEVLAR_UC: "Cheap Kevlar"
  STR_CHEAP_KEVLAR_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}\t\tThe cheap kevlar shirts can be worn under regular clothes. It gives barely any real protection from bullets, but still can make difference between life and death."
  STR_DAMAGED_CHEAP_KEVLAR_KNOWLEDGEBASE: "\t\tTurns out that some of these thugs are wearing some sort of kevlar shirt underneath their jackets. And it is capable of reducing damage from bullets.{NEWLINE}{NEWLINE}\t\tWe can recover damaged kevlars and make them usable again in our workshop... or we could, if we had anything to stitch parts together."
  STR_SUNRISE_UC: "Sunrise armor"
  STR_SUNRISE: "Sunrise armor"
  STR_SUNRISE_KNOWLEDGEBASE: "{NEWLINE}\t\tSunrise armor rev. 5. Compared to previous revisions it is lighter and cheaper while maintaining most of its protective capabilities. Its quality to price ratio makes it the most common outfit in the Zone."
  STR_HEAVYSUNRISE_UC: "Heavy Sunrise armor"
  STR_HEAVYSUNRISE: "Heavy Sunrise armor"
  STR_HEAVYSUNRISE_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}\t\tSunrise armor rev. 4. Offers strong protection against most types of anomalies while having enough bulletproof capabilities to stay relevant in firefights. The material is dense, which makes the outfit heavy."
  STR_HAZMAT_UC: "Hazmat suit"
  STR_HAZMAT: "Hazmat suit"
  STR_HAZMAT_KNOWLEDGEBASE: "{ALT}Closed circuit outfit - forbids drinking.{ALT}{NEWLINE}{NEWLINE}\t\tSpecialized outfit for hazardous environments. Makes wearer immune to radiation and all anomalies except gravitational ones. Makes too much noise to sneak around in it."
  STR_HAZMAT_KASK: "Hazmat suit visor"
  STR_HAZMAT_KASK_KNOWLEDGEBASE: "\t\tIntegral part of hazmat suit. It slightly blurrs the picture. The visor won't endure harder impacts."
  STR_SEVA_UC: "SEVA suit"
  STR_SEVA: "SEVA suit"
  STR_SEVA_KNOWLEDGEBASE: "{ALT}Closed circuit outfit - forbids drinking.{ALT}{NEWLINE}{NEWLINE}\t\tElite outfit for hazardous environments. Offers strong anomaly protection and bulletproof capabilities comparable to Sunrise rev. 5. Very expensive."
  STR_SEVA_KASK: "SEVA suit visor"
  STR_SEVA_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}10{ALT}{NEWLINE}{NEWLINE}\t\tIntegral part of SEVA suit. Despite slight tint does not impair vision and its thickness gives it small chance of stopping a bullet."
  STR_COBRA_UC: "Cobra vest"
  STR_COBRA: "Cobra vest"
  STR_COBRA_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tOutdated, but still capable bulletproof vest. Unpopular amongst stalkers due to lack of protection from environmental hazards."
  STR_BERYL_UC: "Beryl armor"
  STR_BERYL: "Beryl armor"
  STR_BERYL_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tHeavy armor designed for military operations. Grants superior bulletproof protection, but almost no anomaly protection."
  STR_EXO_UC: "Exoskeleton"
  STR_EXO: "Exoskeleton"
  STR_EXO_KNOWLEDGEBASE: "{NEWLINE}\t\tTurns wearer into a walking tank. Consists of heavy metal plating and sophisticated hydraulics allowing wearer to move despite the armor's weight. Susceptible to anomalies, notably Electro being particulary dangerous to the wearer."
  STR_EXO_KASK: "Exoskeleton headgear"
  STR_EXO_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}20{ALT}{NEWLINE}{NEWLINE}\t\tIntegral part of exoskeleton. Is bulletproof (including the face part) and has standard gas mask build in."
  STR_KASK: "Steel helmet"
  STR_KASK_UC: "Steel helmet article"
  STR_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}20{ALT}{NEWLINE}REACTIONS: {ALT}-10{ALT}{NEWLINE}{NEWLINE}\t\tA helmet. Wear it on head, and it keeps bullet away. Unless hit in the face. Steel helmets are uncommon sight among stalkers because they're uncomfortable, heavy and they impair awareness."
  STR_COMBAT_KASK: "Combat helmet"
  STR_COMBAT_KASK_UC: "Combat helmet article"
  STR_COMBAT_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}15{ALT}{NEWLINE}{NEWLINE}\t\tProper military head protection. Not too uncomfortable."
  STR_START_FUNDS1: "Logistics ready"
  STR_START_FUNDS2: "Logistics ready"
  STR_START_FUNDS3: "Logistics ready"
  STR_START_FUNDS_DESC: "While the rest of your team is working on the rest of the building, you moved in to the principal's office, arrange it your way and unpacked the money briefcase.{NEWLINE}{NEWLINE}NOW you may finally get to work."
  STR_SZKOŁA_1: "Workshop"
  STR_SZKOŁA_2: "Research rooms"
  STR_SZKOŁA_3: "Living quarters"
  STR_SZKOŁA_4: "Storage room"
  STR_SZKOŁA_5: "Guests section"
  STR_SZKOŁA_6: "Captives cellar"
  STR_COMPOUND: "Compound"
  STR_CAMP: "Central part"
  STR_SZKOŁA_KNOWLEDGE: "\t\tThis school will serve as our base of operations. It doesn't have any structral damage, anomalies or contamination. Take care of it, and it will take care of us.{NEWLINE}{NEWLINE}\t\tKeep some stalkers in for guard duty at all times. You never know when looters will pay us unexpected visit. Or maybe enemies we've yet to make.{NEWLINE}{NEWLINE}\t\tThe school is big, but not infinite. We have no means to expand our storage, or living space."
  STR_SZKOŁA_1_KNOWLEDGEBASE: "\t\tWe dedicated half of the first floor for our technicians to do the tinkering. The rooms are kinda cramped, so we can't have too many projects manufactured at a time."
  STR_SZKOŁA_2_KNOWLEDGEBASE: "\t\tChemistry classroom and computer lab on the second floor were obvious choice to put our lab dudes in. Should be enough for now, and there is enough room to put any scientific furniture we'll manage to get along the way."
  STR_SZKOŁA_3_KNOWLEDGEBASE: "\t\tMost of rooms in eastern wing we'll be using as living space. We have room for {ALT}40 guys{ALT} (including lab dudes and technicians) and no more."
  STR_SZKOŁA_4_KNOWLEDGEBASE: "\t\tThis is our storage. Our storage capacity is capped at {ALT}100 units{ALT}, but it should be more than enough to meet our needs. We'll be selling most of our loot anyway."
  STR_SZKOŁA_5_KNOWLEDGEBASE: "\t\tThis is where we accomodate our guests. When we rescue some stalkers in need, or when someone randomly comes and asks for accomodation, this is where you can check them out. We have room for {ALT}11{ALT} guests."
  STR_SZKOŁA_6_KNOWLEDGEBASE: "\t\tBasement is where we keep our captives - stalkers or smaller animals. We have room for {ALT}8{ALT} of those."
  STR_SETUP_CAMPS: "Setting up camps"
  STR_SETUP_CAMPS_KNOWLEDGEBASE: "\t\tThe Zone is big, so if we want to run our operations effectively, we should set up a network of camps. Camps will help our stalkers do more work in regions further from our main base without spending so much time on return trips.{NEWLINE}{NEWLINE}\t\tWe can set up camps in most of the Zone, but it doesn't mean we should. Our boys will be on their own, so make sure they are trained and equipped enough to take on local dangers. And looters, since camps attract looters.{NEWLINE}{NEWLINE}\t\tTents can be assembled and disassembled at will, so there is nothing preventing us from packing the camp up if, let's say, you've lost interest in that region, or there's a camp raid inbound that you don't want to deal with."
  STR_TENT_KNOWLEDGEBASE: "\t\tOne tent provides room for {ALT}5 stalkers{ALT} and {ALT}5 storage space{ALT}, independently from limits of our main base. 5 storage is not much, but should be enough to store campers' guns and ammo. Tents are not suitable to do any research or manufacturing, so if camp team wins a battle, either sell the loot or transfer it to our main base."
  STR_EXPEDITION_SMALL: "SMALL EXPED."
  STR_EXPEDITION_SMALL_FULL: "Small Expedition"
  STR_EXPEDITION_SMALL_KNOWLEDGEBASE: "\t\tSmaller, more agile expedition. Good for covering larger areas. Can catch up to other small expeditions, but gets outnumbered by large ones.{NEWLINE}{NEWLINE}Stalkers: {ALT}3{ALT}{NEWLINE}Speed: {ALT}FAST{ALT}{NEWLINE}Sight range: {ALT}FAR{ALT}"
  STR_EXPEDITION_LARGE: "LARGE EXPED."
  STR_EXPEDITION_LARGE_FULL: "Large Expedition"
  STR_EXPEDITION_LARGE_KNOWLEDGEBASE: "\t\tLarger expedition is more suited for battle than for scouting. Good for raiding camps and scavenging.{NEWLINE}{NEWLINE}{NEWLINE}Stalkers: {ALT}7{ALT}{NEWLINE}Speed: {ALT}SLOW{ALT}{NEWLINE}Sight range: {ALT}MEDIUM{ALT}"
  STR_EXCURSION: "EXCURSION"
  STR_EXCURSION_FULL: "Excursion"
  STR_EXCURSION_KNOWLEDGEBASE: "\t\tThis is not really an expedition. It's more like sending a bunch of boys out there to kick ass. It's range is limited to more or less sight range of a camp.{NEWLINE}{NEWLINE}Stalkers: {ALT}16{ALT}{NEWLINE}Speed: {ALT}EXPRESS{ALT}{NEWLINE}Sight range: {ALT}NEAR{ALT}{NEWLINE}{ALT}Limited range{ALT}"
  STR_CHEAP_KEVLAR: "Cheap Kevlar"
  STR_FIST: "Fist"
  STR_FIST_KNOWLEDGEBASE: "\t\tThe go-to problem solving tool on the streets. In the Zone there are more effective solutions for melee diplomacy, such as knife or butt of a rifle."
  STR_KNIFE: "Knife"
  STR_KNIFE_KNOWLEDGEBASE: "\t\tPrimary survival tool. Don't go anywhere without it. Seriously, almost everyone in the Zone has a knife."
  STR_CONTACT_CHEAP_KEVLAR_DEALER: "Contact: cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_LOCATION: "Cheap kevlar dealer location"
  STR_CONTACT_CHEAP_KEVLAR_DEALER_NOT: "Contact: cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER: "Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_C: "[COMPLETED] Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_NOC: "[COMPLETED] Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_C_KNOWLEDGEBASE: "\t\tWe found the guy making those cheap kevlars. He lives somewhere in Zaton. He can provide us with cheap kevlars, as long as we have cash."
  STR_CHEAP_KEVLAR_DEALER_NOC_KNOWLEDGEBASE: "\t\tWe found the guy making those cheap kevlars. That's the good news. The bad news is that he won't be dealing with us. I dunno, our boys came to his little hut and he freaked out on them, shouting something about messengers of devil and all that. Best they could to is to smash his face in and steal couple shirts he had lying around.{NEWLINE}{NEWLINE}\t\tSo now our only source of these kevlar shirts is to steal them from bandits. Guess we can't have it too easy on absurd difficulty, eh?"
  STR_CHEAP_KEVLAR_DEALER_KNOWLEDGEBASE: "\t\tSomewhere in the Zone there is a guy that makes these cheap kevlar shirts the bandits are wearing. He's not affiliated with the bandits, so if we can find him, maybe we can buy these kevlars for ourselves.{NEWLINE}{NEWLINE}\t\tFirst, we'll have to find out where he lives. For that we should interrogate a bandit leader. And if we don't have a leader, maybe one of those grunts happen to know anything."
  STR_BASIC_GUNS_DEAL: "Find a deal for basic guns"
  STR_BASIC_GUNS_DEAL_KNOWLEDGEBASE: "\t\tWe found suppliers of basic equipment, but that's not enough if we're going big in the Zone. We need to find suppliers of better guns. Maybe not RPGs and HMGs right off the bat, but something commonly available out here.{NEWLINE}{NEWLINE}\t\tIf we reach out to one of the factions, maybe they will trade with us. Other option is to interrogate bandit leaders and make them tell us about their suppliers."
  STR_BASIC_GUNS_DEAL_PREQ: "Basic guns deal opportunity"
  STR_STRIKE_BASIC_GUNS_DEAL: "Basic guns deal"
  STR_BASIC_GUNS_DEAL_C: "[COMPLETED] Basic guns deal"
  STR_BASIC_GUNS_DEAL_C_KNOWLEDGEBASE: "\t\tNow we can buy Vipers, Saw-offs and basic ammunition. It's not much, but it should help us survive until we find better shooters."
  STR_SUNRISE_DEAL: "Find a deal for Sunrise armor"
  STR_SUNRISE_DEAL_KNOWLEDGEBASE: "\t\tEvery other stalker in the Zone is dressed up in Sunrise, which means they are commonly available. We should secure a supply of these. {NEWLINE}{NEWLINE}\t\tMaybe if we ask around among experienced stalkers they will tell us about some vendors."
  STR_SUNRISE_DEAL_PREQ: "Sunrise armor deal opportunity"
  STR_STRIKE_SUNRISE_DEAL: "Sunrise armor deal"
  STR_SUNRISE_DEAL_C: "[COMPLETED] Sunrise armor deal"
  STR_SUNRISE_DEAL_C_KNOWLEDGEBASE: "\t\tWe found a place not too far where we can buy Sunrise armors."
  STR_BETTER_GUNS_DEAL: "Find a deal for better guns"
  STR_BETTER_GUNS_DEAL_KNOWLEDGEBASE: "\t\tOk, we have some shooters in the armory. Now let's find suppliers for something stronger. To get access to better deals, we need to become major players.{NEWLINE}{NEWLINE}\t\tMaybe we'll get their attention if we achieve 5 000 monthly rating."
  STR_STRIKE_BETTER_GUNS_DEAL: "Better guns deal"
  STR_BETTER_GUNS_DEAL_C: "[COMPLETED] Better guns deal"
  STR_BETTER_GUNS_DEAL_C_KNOWLEDGEBASE: "\t\tNow that we have some good contacts of our own, we can buy some serious gear for some serious business."
  STR_ELITE_GUNS_DEAL: "Find a deal for elite guns"
  STR_ELITE_GUNS_DEAL_KNOWLEDGEBASE: "\t\tSo far we don't have to worry about access to shooters. But at some point we might have to fight our way to the center of the Zone. Before that happens, let's keep an eye for opportunities to get access to biggest, baddest guns in the Zone to equip our expedition with."
  STR_STRIKE_ELITE_GUNS_DEAL: "Elite guns deal"
  STR_STRIKE_ELITE_GUNS_DEAL_NOT: "Elite guns deal"
  STR_ELITE_GUNS_DEAL_C: "[COMPLETED] Elite guns deal"
  STR_ELITE_GUNS_DEAL_NOC: "[COMPLETED] Elite guns deal"
  STR_ELITE_GUNS_DEAL_C_KNOWLEDGEBASE: "\t\tI don't know how did you pull it off, but you managed to arrange access to the best guns in the Zone."
  STR_ELITE_GUNS_DEAL_NOC_KNOWLEDGEBASE: "\t\tWelp... That was to be expected. Life would be too easy if there was anyone willing to sell us all that elite gear."
  STR_HOWLING: "The howling"
  STR_HOWLING_DESC: "Boss, we have a situation.{NEWLINE}{NEWLINE}So it started with those annoying dogs howling at night. Yesterday it was so obnoxious it woke me up in the middle of a night an I was like 'That's it, suka!' I went scouting, and I shit you not, they have a NEST up north! We gotta clear it out before we get flodded with dogs!"
  STR_CLEAR_DOG_NEST: "Clear dog nest"
  STR_CLEAR_DOG_NEST_KNOWLEDGEBASE: "\t\tBoss, that dog nest up north needs to be dealt with. If their population gets too high, they'll turn our base into their hunting grounds.{NEWLINE}{NEWLINE}\t\tBut careful, there's at least 20 of them. That's how many I managed to count, just on the surface. This is not a job for just three guys with PMs.{NEWLINE}{NEWLINE}\t\tWhile we prepare the assault, we should keep more dudes at base in case some random packs get too close."
  STR_CLEAR_DOG_NEST_C: "[COMPLETED] Clear dog nest"
  STR_CLEAR_DOG_NEST_C_KNOWLEDGEBASE : "\t\tCrisis averted. We don't have to deal with hordes of dogs looming over our base... for now."
  STR_HIGHSCORE_MILESTONE: "(achieve 5000 monthly rating)"
  STR_INAVAILABILITOR: "(special)"
  STR_HIGHSCORE_EVENT: "Major league."
  STR_HIGHSCORE_EVENT_DESC: "Nice work, boss. Achieving a monthly rating that high means we're a major player now. Which means we can start hangin' out with other major players."
  STR_PM: "PM"
  STR_PM_UC: "PM article"
  STR_PM_KNOWLEDGEBASE: "\t\tPM stands for 'Pistolet Makarova'. It's cheap, common, and weak. But still it's better than throwing rocks."
  STR_PM_S: "Noiseless PM"
  STR_PM_S_UC: "Noiseless PM article"
  STR_PM_S_KNOWLEDGEBASE: "\t\tVariant of PM with integrated silencer."
  STR_PM_CLIP: "PM clip"
  STR_PM_AP_CLIP: "PM clip (armor piercing)"
  STR_USP: "Compact pistol"
  STR_USP_S: "Compact pistol [S]"
  STR_USP_S-: "Compact pistol [-S]"
  STR_USP_UC: "Compact pistol article"
  STR_USP_KNOWLEDGEBASE: "\t\tAll-round upgrade compared to PM. Can have a silencer attached if you find one somewhere."
  STR_USP_CLIP: "Compact pistol clip"
  STR_SAWOFF: "Sawn-off shotgun"
  STR_SAWOFF_UC: "Sawn-off shotgun article"
  STR_SAWOFF_KNOWLEDGEBASE: "\t\tMind fixed TU cost. Common weapon seen in rookies' hands, but can be used by pros as a sidearm carried on belt for sudden close encounters. Due to shortened barrel the buckshot spread is large and damage falls off rapidly."
  STR_DBSHOTGUN: "Double barrel shotgun"
  STR_DBSHOTGUN_UC: "Double barrel shotgun article"
  STR_DBSHOTGUN_KNOWLEDGEBASE: "\t\tKeeps boars and bandits off your lawn. Surprisingly effective at long ranges tue to long barrels."
  STR_WINCHESTER: "Pump action shotgun"
  STR_WINCHESTER_UC: "Pump action shotgun article"
  STR_WINCHESTER_KNOWLEDGEBASE: "\t\tYour typical pump-action shotgun."
  STR_SPAS: "Auto shotgun"
  STR_SPAS_UC: "Auto shotgun article"
  STR_SPAS_KNOWLEDGEBASE: "\t\tSolid close range weapon, especially in hands of pros with large TU pool."
  STR_ELIMINATOR: "Eliminator shotgun"
  STR_ELIMINATOR_UC: "Eliminator shotgun article"
  STR_ELIMINATOR_KNOWLEDGEBASE: "\t\tThe ultimate shotgun available in the Zone. Long reload time is its major weakness."
  STR_AMMO_2BS: "Shotgun shells (buckshot, 2)"
  STR_AMMO_2AP: "Shotgun shells (armor piercing, 2)"
  STR_VIPER: "Viper SMG"
  STR_VIPER_UC: "Viper SMG article"
  STR_VIPER_KNOWLEDGEBASE: "\t\tThe most affordable automatic weapon in the Zone."
  STR_VIPER_CLIP: "Viper clip"
  STR_VIPER_AP_CLIP: "Viper clip (armor piercing)"
  STR_AK74: "Short rifle"
  STR_AK74_S: "Short rifle [S]"
  STR_AK74_S-: "Short rifle [-S]"
  STR_AK74_UC: "Short rifle article"
  STR_AK74_KNOWLEDGEBASE: "\t\tSpits out bullets fast, but has low accuracy and range. Shines the most at close to mid ranges."
  STR_OBOKAN: "Service rifle"
  STR_OBOKAN_G: "Service rifle [G]"
  STR_OBOKAN_S: "Service rifle [S]"
  STR_OBOKAN_GS: "Service rifle [GS]"
  STR_OBOKAN_G+S: "Service rifle [GS]"
  STR_OBOKAN_S+G: "Service rifle [GS]"
  STR_OBOKAN_G-: "Service rifle [-G]"
  STR_OBOKAN_S-: "Service rifle [-S]"
  STR_OBOKAN_GS-: "Service rifle [-GS]"
  STR_OBOKAN_UC: "Service rifle article"
  STR_OBOKAN_KNOWLEDGEBASE: "\t\tReliable rifle with average parameters, performs well in most situations."
  STR_AKM: "Modernized rifle"
  STR_AKM_G: "Modernized rifle [G]"
  STR_AKM_S: "Modernized rifle [S]"
  STR_AKM_GS: "Modernized rifle [GS]"
  STR_AKM_G+S: "Modernized rifle [GS]"
  STR_AKM_S+G: "Modernized rifle [GS]"
  STR_AKM_G-: "Modernized rifle [-G]"
  STR_AKM_S-: "Modernized rifle [-S]"
  STR_AKM_GS-: "Modernized rifle [-GS]"
  STR_AKM_UC: "Modernized rifle article"
  STR_AKM_KNOWLEDGEBASE: "\t\tBetter accuracy and range, but slower rate of fire. Better suited for outdoors shootouts where distances are longer."
  STR_GROZA: "Thunder rifle"
  STR_GROZA_UC: "Thunder rifle article"
  STR_GROZA_KNOWLEDGEBASE: "\t\tAdvanced top-tier rifle with integrated grenade launcher."
  STR_AMMO_WP: "5.45 clip"
  STR_AMMO_WP_AP: "5.45 clip (armor piercing)"
  STR_AMMO_WP_UC: "5.45 clip article"
  STR_AMMO_WP_KNOWLEDGEBASE: "\t\tThis one is for:{NEWLINE}\t- Short rifle{NEWLINE}\t- Service rifle{NEWLINE}\t- Modernized rifle{NEWLINE}\t- Thunder rifle"
  STR_BULLDOG: "Bulldog grenade launcher"
  STR_BULLDOG_UC: "Bulldog grenade launcher article"
  STR_BULLDOG_KNOWLEDGEBASE: "\t\tShoots VOG grenades. Deals a lot of damage, but the ammunition is expensive. Use wisely."
  STR_GL_WP: "VOG underbarrel grenade launcher"
  STR_UGL_WP: "VOG underbarrel grenade launcher"
  STR_UGL_WP_UC: "VOG underbarrel grenade launcher article"
