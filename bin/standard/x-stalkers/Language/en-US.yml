  STR_L85_KNOWLEDGEBASE: "\t\tHas integrated scope and very accurate single shot, but firing in bursts is problematic due to recoil."
  STR_F2000: "Millenium rifle"
  STR_F2000_UC: "Millenium rifle article"
  STR_F2000_KNOWLEDGEBASE: "\t\tOne of the best shooters available in the Zone. Expensive, but worth it. Has integrated scope and grenade launcher."
  STR_AMMO_NATO: "5.56 clip"
  STR_AMMO_NATO_AP: "5.56 clip (armor piercing)"
  STR_AMMO_NATO_UC: "5.56 clip article"
  STR_AMMO_NATO_KNOWLEDGEBASE: "\t\tThis one is for:{NEWLINE}\t- Light rifle{NEWLINE}\t- Siege rifle{NEWLINE}\t- Longbow rifle{NEWLINE}\t- Millenium rifle"
  STR_GL_NATO: "M203 underbarrel grenade launcher"
  STR_UGL_NATO: "M203 underbarrel grenade launcher"
  STR_UGL_NATO_UC: "M203 underbarrel grenade launcher article"
  STR_UGL_NATO_KNOWLEDGEBASE: "\t\tUnderbarrel grenade launcher attachable to:{NEWLINE}\t- Light rifle{NEWLINE}\t- Siege rifle{NEWLINE}\t- Longbow rifle{NEWLINE}{NEWLINE}\t\tIt's meant to be attached, but noone said you can't use it on its own."
  STR_GRENADE_NATO: "M203 grenade"
  STR_GRENADE_NATO_UC: "M203 grenade article"
  STR_GRENADE_NATO_KNOWLEDGEBASE: "\t\tThis one is for attachment to:{NEWLINE}\t- Light rifle{NEWLINE}\t- Siege rifle{NEWLINE}\t- Longbow rifle{NEWLINE}\t- Millenium rifle"
  STR_ASVAL: "Noiseless rifle"
  STR_ASVAL_UC: "Noiseless rifle article"
  STR_ASVAL_KNOWLEDGEBASE: "\t\tAssault variant of Vintage rifle. It has detached scope and burst fire capability."
  STR_VINTOREZ: "Vintage rifle"
  STR_VINTOREZ_UC: "Vintage rifle article"
  STR_VINTOREZ_KNOWLEDGEBASE: "\t\tNoiseless, fireless sniper rifle, firing subsonic rounds. Falls off at longer ranges."
  STR_AMMO_939: "9.39 clip"
  STR_AMMO_939_AP: "9.39 clip (armor piercing)"
  STR_AMMO_939_UC: "9.39 clip article"
  STR_AMMO_939_KNOWLEDGEBASE: "\t\tThis one is for:{NEWLINE}\t- Vintage rifle{NEWLINE}\t- Noiseless rifle"
  STR_MOSIN: "Bolt action rifle"
  STR_MOSIN_UC: "Bolt action rifle article"
  STR_MOSIN_KNOWLEDGEBASE: "\t\tOld, but is still capable of firing bullets. Thanks to integrated scope its somewhat suitable for sniping."
  STR_MOSIN_CLIP: "Bolt action rifle ammo"
  STR_SVU: "Sniper rifle"
  STR_SVU_UC: "Sniper rifle article"
  STR_SVU_KNOWLEDGEBASE: "\t\tOne of few sniper rifles available in the Zone."
  STR_SVU_CLIP: "Sniper rifle clip"
  STR_MOLOTOV: "Molotov Cocktail"
  STR_MOLOTOV_KNOWLEDGEBASE: "\t\tOld school design fire bomb. Once cloth at the top is lit, throwing it will cause burst of flames, burning anyone caught in a blast, and illuminating an area."
  STR_LIGHT_UP: "Light it up"
  STR_ITS_LIT: "It's lit"
  STR_WEAK_GRENADE: "HE grenade"
  STR_WEAK_GRENADE_UC: "HE grenade article"
  STR_WEAK_GRENADE_KNOWLEDGEBASE: "\t\tHand grenade, explodes after set amount of half-turns."
  STR_FRAG_GRENADE: "Frag grenade"
  STR_FRAG_GRENADE_UC: "Frag grenade article"
  STR_FRAG_GRENADE_KNOWLEDGEBASE: "\t\tHand grenade, explodes after set amount of half-turns."
  STR_SILENCER_USP: "Silencer for Compact pistol"
  STR_SILENCER_WP: "5.45 silencer"
  STR_SILENCER_NATO: "5.56 silencer"
  STR_BOLTS: "Box of bolts"
  STR_BOLTS_KNOWLEDGEBASE: "\t\tThis is convenient way to deal with anomalies. Bolts can be thrown to discharge anomalies from safe distance before swooping in, or to scout uncertain tiles.{NEWLINE}{NEWLINE}\t\tCareful not to accidentaly throw the entire box."
  STR_THROW_ONE: "Throw one bolt"
  STR_ANTIRAD: "Antiradiation drugs"
  STR_ANTIRAD_KNOWLEDGEBASE: "\t\tCures radiation poisoning. All {ALT}100 rads{ALT} cured in one dose."
  STR_KOMANDOS: "Commando wine"
  STR_KOMANDOS_KNOWLEDGEBASE: "\t\tThe cheapest wine out there. Tastes like sulfur and apples. Not as strong as vodka in terms of curing radiation poisoning ({ALT}4 rads{ALT}) or getting drunk ({ALT}1 stack{ALT}). Still, it causes enough mind numbness, making it more suitable for recovering morale ({ALT}10{ALT}) and countering psionic emissions."
  STR_DRINK: "Drink"
  STR_KOZAK: "Cossacks vodka"
  STR_KOZAK_KNOWLEDGEBASE: "\t\tIt's vodka. You drink it. Vodka can be used as budget cure for radiation poisoning ({ALT}15 rads{ALT}). Or restore a little bit of morale ({ALT}10{ALT}). Applies {ALT}3 stacks{ALT} of drunk debuff."
  STR_CANTEEN: "Canteen"
  STR_CANTEEN_KNOWLEDGEBASE: "\t\tTired? Hungover? Drink! It recovers {ALT}20 stamina{ALT} and removes {ALT}5 stun{ALT}.{NEWLINE}{NEWLINE}\t\tIt's filled with clean, drinkable water naturally."
  STR_ENERGYDRINK: "Energy Drink"
  STR_ENERGYDRINK_KNOWLEDGEBASE: "\t\tGeneric energy drink made of sugar, caffeine, vitamins and sugar. Recovers {ALT}50 energy, 15 stun and removes two stacks of drunk debuff{ALT}. If used while sober, adds stack in the other way, thus increasing stats.{NEWLINE}{NEWLINE}\t\tDon't try mixing alcohol and energy drinks at home. Our stalkers are highly trained slavs capable of surviving in the Zone and can do it safely."
  STR_BANDAGE: "Bandage"
  STR_BANDAGE_KNOWLEDGEBASE: "\t\tEach use removes {ALT}3 fatal wounds{ALT} and recovers {ALT}1 HP{ALT}. Quickly stops bleeding and helps to survive until treatment with an actual medkit. Can be used on self and on others, including downed enemies if we need them alive."
  STR_MEDKIT: "Medkit"
  STR_MEDKIT_KNOWLEDGEBASE: "\t\tMedkits in the Zone have have unique trait - {ALT}heal action always recovers HP, even if there are no fatal wounds on the patient{ALT}. Other than that the instruction manual is compliant with international standard.{NEWLINE}{NEWLINE}\t{ALT}HEAL{ALT}: recovers 5 HP and removes 1 fatal wound.{NEWLINE}\t{ALT}STIMULANT{ALT}: recovers 10 stamina and removes 10 stun.{NEWLINE}\t{ALT}PAINKILLER{ALT}: recovers 10 morale, plus morale based on missing health."
  STR_SHOVEL: "Shovel"
  STR_SHOVEL_KNOWLEDGEBASE: "\t\tShovels can be used to dig a ditch to hide in when a firefight takes place in open field, or to set up an ambush.{NEWLINE}{NEWLINE}\t\tCan also double as blunt weapon to KO someone with. Works better than butt of a rifle."
  STR_AMMO_BOX: "Ammo box"
  STR_AMMO_BOX_KNOWLEDGEBASE: "\t\tHolds up to 10 clips of ammunition. Useful for very long expeditions where there's a lot of shooting ahead and no opportunities to loot more ammo on the way.{NEWLINE}{NEWLINE}\t\tTaking clips to/from box is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_SHELL_BOX: "Shotgun shell box"
  STR_SHELL_BOX_KNOWLEDGEBASE: "\t\tHolds up to 32 shotgun shells. Useful for very long expeditions where there's a lot of shooting ahead and no opportunities to loot more ammo on the way.{NEWLINE}{NEWLINE}\t\tTaking shells to/from box is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_ARTIFACT_CONTAINER: "Artifact container"
  STR_ARTIFACT_CONTAINER_KNOWLEDGEBASE: "\t\tHolds up to 6 artifacts. Can be used to efficiently gather artifacts from anomaly site. Artifacts inside container do not emit radiation or grant any bonuses to the carrier, even if the container is equipped on belt.{NEWLINE}{NEWLINE}\t\tTaking artifacts to/from container is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_LOCKED_ARTIFACT_CONTAINER: "Locked artifact container"
  STR_LOCKED_ARTIFACT_CONTAINER_KNOWLEDGEBASE: "\t\tThe artifact containers have a lock which can be locked/unlocked with right combination... or right tools. Give these to our guys at the workshop so they can open them without damaging the artifacts inside."
  STR_WALLET: "Wallet"
  STR_MONEY: "Money"
  STR_MONEY_50: "Money bill (50)"
  STR_MONEY_100: "Money bill (100)"
  STR_MONEY_200: "Money bill (200)"
  STR_MONEY_500: "Money bill (500)"
  STR_MONEY_1000: "Money bill (1000)"
  STR_MONEY_: "Money"
  STR_MONEY_KNOWLEDGEBASE: "\t\tMost stalkers have some money on them to buy supplies with. We can sell money bills to add them to our funding."
  STR_DIG: "Dig"
  STR_ANOMALIES_ARTIFACTS: "Anomalies and Artifacts"
  STR_ARTIFACTS_SAFETY: "Artifacts safety manual"
  STR_ARTIFACTS_SAFETY_KNOWLEDGEBASE: "\t\tArtifacts are seemingly random objects roughly the size of a hand, but having unusual properties and holding great scientific value. They are worth fortune outside of the Zone.{NEWLINE}{NEWLINE}\t\tAlmost every artifact, when worn on belt, grants wearer certain bonus, but irradiates him every turn. Radiation threatens the wearer despite worn protective suit, even if we haven't researched the artifact yet. Carrying a lot of artifacts will quickly cause fatal radiation poisoning.{NEWLINE}{NEWLINE}\t\tTo carry them safely, artifacts should be put in backpacks, or artifact containers. That way, artifacts don't poison the wearer but also don't grant him any bonuses."
  STR_KOTLET: "Kotlet"
  STR_KOTLET_KNOWLEDGEBASE: "RADIATION: {ALT}-4 R/t{ALT}{NEWLINE}EFFECT: Absorbs radiation.{NEWLINE}{NEWLINE}\t\tCommon artifact made by Springboard anomaly. Looks like a kotlet, hence the name. It's consistence resembles rubber."
  STR_BEAD: "Bead"
  STR_BEAD_KNOWLEDGEBASE: "RADIATION: {ALT}5 R/t{ALT}{NEWLINE}EFFECT: Reduces {ALT}EXPLOSIVE{ALT}, {ALT}IMPACT{ALT} and {ALT}ELECTRIC{ALT} damage by {ALT}20%{ALT}, as well as reduces {ALT}STUN{ALT} damage taken in general.{NEWLINE}{NEWLINE}\t\tArtifact made by Springboard anomaly. Kinda looks like three metal rods tangled together like a bead. And it's just as hard as metal rods. These 'beads' cannot be untangled."
  STR_SPIRAL: "Spiral"
  STR_SPIRAL_KNOWLEDGEBASE: "RADIATION: {ALT}7 R/t{ALT}{NEWLINE}EFFECT: Reduces {ALT}BALLISTIC{ALT} damage by {ALT}10%{ALT}{NEWLINE}{NEWLINE}\t\tRare artifact made by Springboard anomaly. Creates roughly 1cm thick layer of gravitational disturbance around it. This layer can extend to cover person carrying it. Stalkers claim that you can 'feel' this field as you move."
  STR_TULLIP: "Tullip"
  STR_TULLIP_KNOWLEDGEBASE: "RADIATION: {ALT}3 R/t{ALT}{NEWLINE}EFFECT: Reduces {ALT}RUPTURE{ALT} damage by {ALT}10%{ALT} and reduces chance to get fatal wounds.{NEWLINE}{NEWLINE}\t\tCommon artifact made by Vortex anomaly. Has consistency of a balloon. And has similar smell."
  STR_PASTA: "Pasta"
  STR_PASTA_KNOWLEDGEBASE: "RADIATION: {ALT}-6 R/t{ALT}{NEWLINE}EFFECT: Absorbs radiation.{NEWLINE}{NEWLINE}\t\tArtifact made by Vortex anomaly. Resembles a handful of pasta stuck together. It's elastic, but very resistant to stretching - the 'strings' cannot be ripped out by hand."
  STR_HEART: "Heart"
  STR_HEART_KNOWLEDGEBASE: "RADIATION: {ALT}7 R/t{ALT}{NEWLINE}EFFECT: Reduces damage by {ALT}4{ALT}{NEWLINE}{NEWLINE}\t\tRare artifact made by Vortex anomaly. It feels warm to the touch, and the warmth felt extends to the rest of the body if the artifact is held long enough."
  STR_SHARD: "Shard"
  STR_SHARD_KNOWLEDGEBASE: "RADIATION: {ALT}3 R/t{ALT}{NEWLINE}EFFECT: Reduces {ALT}CHEMICAL{ALT} damage by {ALT}25%{ALT} and heals {ALT}2 HP{ALT}.{NEWLINE}{NEWLINE}\t\tCommon artifact made by Kvass anomaly. Creates small aura around it, which visibly reduces effectiveness of Kvass discharge. Creates pretty lightshow if you shine a flashlight through it."
  STR_EMERALD: "Emerald"
  STR_EMERALD_KNOWLEDGEBASE: "RADIATION: {ALT}5 R/t{ALT}{NEWLINE}EFFECT: Grants {ALT}+10 BRAVERY{ALT}, {ALT}+10 PSI STRENGTH{ALT}{NEWLINE}{NEWLINE}\t\tArtifact made by Kvass anomaly. At first sight you would think it's an actual emerald, but this artifact is heavier. It has psychoactive properties - it induces the feeling of courage and confidence. And it noticably lowers unpleasant sensation caused by psionic emmisions."
  STR_SNOT: "Snot"
  STR_SNOT_KNOWLEDGEBASE: "RADIATION: {ALT}7 R/t{ALT}{NEWLINE}EFFECT: Lowers {ALT}MAX TUs{ALT} by {ALT}4{ALT}, but reduces costs of all actions by {ALT}3 TUs{ALT}.{NEWLINE}{NEWLINE}\t\tRare artifact made by Kvass anomaly. Has consistency similar to a gelatine, but it's high integrity makes it impossible to tear it to smaller pieces. It disturbs perception of reality - it makes it seem as if the time passed slower near it, but this feeling is caused by specific stimulation of nervous system, rather than disturbance of time-space continuum."
  STR_RAISIN: "Raisin"
  STR_RAISIN_KNOWLEDGEBASE: "RADIATION: {ALT}3 R/t{ALT}{NEWLINE}EFFECT: Adds {ALT}4-12 ELECTRIC{ALT} damage to melee attacks.{NEWLINE}{NEWLINE}\t\tCommon artifact made by Electro. Looks like oversized raisin, except it's blue. It accumulates electrostatic charge over time, which can be released by impact or sudden movement."
  STR_BATTERY: "Battery"
  STR_BATTERY_KNOWLEDGEBASE: "RADIATION: {ALT}5 R/t{ALT}{NEWLINE}EFFECT: Grants {ALT}+9 TUs{ALT}, recovers {ALT}8 STAMINA{ALT} and {ALT}4 STUN{ALT}{NEWLINE}{NEWLINE}\t\tArtifact made by Electro anomaly. It stimulates the organism and increases vigor. The pointy edges are surprisingly sharp."
  STR_ATOM: "Atom"
  STR_ATOM_KNOWLEDGEBASE: "RADIATION: {ALT}7 R/t{ALT}{NEWLINE}EFFECT: Grants {ALT}+3 TUs{ALT}, {ALT}+5 REACTIONS{ALT}, {ALT}+5 ACCURACY{ALT}.{NEWLINE}{NEWLINE}\t\tRare artifact made by Electro anomaly. It emits dim light. The particles orbiting it pass through solid objects."
  STR_DROPLET: "Droplet"
  STR_DROPLET_KNOWLEDGEBASE: "RADIATION: {ALT}3 R/t{ALT}{NEWLINE}EFFECT: Reduces {ALT}FIRE{ALT} damage by {ALT}25%{ALT} and heals {ALT}2{ALT} fatal wounds.{NEWLINE}{NEWLINE}\t\tCommon artifact made by Burner anomaly. When rubbed against any rugged surface (or another Droplet) hard enough, it creates sparkles which may ignite fire. They can start a fire in our base if dropped on the table too hard. Be careful, will ya?"
  STR_FIREBALL: "Fireball"
  STR_FIREBALL_KNOWLEDGEBASE: "RADIATION: {ALT}5 R/t{ALT}{NEWLINE}EFFECT: Heals {ALT}1 HP{ALT} and {ALT}1{ALT} fatal wound. If there are no fatal wounds, heals {ALT}4 HP{ALT} instead.{NEWLINE}{NEWLINE}\t\tArtifact made by Burner anomaly. It feels warm to the touch. There is a liquid core inside semi transparent shell"
  STR_MEDUZA: "Medusa"
  STR_MEDUZA_KNOWLEDGEBASE: "RADIATION: {ALT}7 R/t{ALT}{NEWLINE}EFFECT: Grants {ALT}+10 STRENGTH{ALT} and {ALT}+10 MAX HP{ALT}{NEWLINE}{NEWLINE}\t\tRare artifact made by Burner anomaly. It looks like something fished out of the sea. The core is rock hard, and the 'tentacles' are elastic like rubber."
  STR_MYSTERIOUS_CRYSTAL: "Mysterious crystal"
  STR_MYSTERIOUS_CRYSTAL_KNOWLEDGEBASE: "\t\tThe crystal recovered from dog nest has some interesting properties. Firstly, it emits dim light. Judging by the vegetation surrounding the crystal in the cave our field colleagues found it in suggests that the light is enough for photosynthesis to occur. Secondly, there seems to be a core inside, which emmits sound. It can only be heard when putting ear against crystal's surface.{NEWLINE}{NEWLINE}\t\tI suggest we keep at least one sample for further research."
  STR_GUEST_STALKER: "Guest stalker (rookie)"
  STR_GUEST_STALKER_EXPERIENCED: "Guest stalker (experienced)"
  STR_FUEL_CANISTER: "Fuel canister"
  STR_FUEL_CANISTER_KNOWLEDGEBASE: "\t\tFuel in the Zone is even more expensive than outside. We can use it to make molotov cocktails, or fuel a vehicle, if we can get our hands on one."
  STR_DAMAGED_CHEAP_KEVLAR: "Damaged cheap kevlar"
  STR_DAMAGED_SUNRISE: "Damaged Sunrise armor"
  STR_DAMAGED_HEAVYSUNRISE: "Damaged Heavy Sunrise armor"
  STR_DAMAGED_COBRA: "Damaged Cobra vest"
  STR_DAMAGED_BERYL: "Damaged Beryl armor"
  STR_DAMAGED_EXO: "Damaged Exoskeleton"
  STR_MUNITIONS: "Munitions"
  STR_MAKE_MOLOTOVS: "Make molotovs"
  STR_COMBINE_MOLOTOVS: "Salvage fuel from molotovs"
  STR_HIRE_STALKER: "Hire stalker"
  STR_TAMED_BLINDDOG: "Tamed blind dog"
  STR_REPAIR_CHEAP_KEVLAR: "Repair cheap kevlar"
  STR_REPAIR_SUNRISE: "Repair Sunrise armor"
  STR_REPAIR_HEAVYSUNRISE: "Repair Heavy Sunrise armor"
  STR_REPAIR_COBRA: "Repair Cobra vest"
  STR_REPAIR_BERYL: "Repair Beryl armor"
  STR_REPAIR_EXO: "Repair Exoskeleton"
  STR_REPAIRS: "Repairs"
  STR_UNBOX_LOCKED_ARTIFACT_CONTAINER: "Unbox locked artifact container"
  STR_INTRO: "Hey boss"
  STR_INTRO_KNOWLEDGEBASE: "\t\tCheck out what I found - it's a Personal Digital Assistant. Is like a computer, but you can fit it in your pocket. Yes, I know how much you hate computers, but I'm sure you'll change your mind after you use it for a while and see for yourself how convenient it is.{NEWLINE}{NEWLINE}\t\tHere you can write down all the important shit that we need to remember, like our to-do list. Also I'll make sure to upload all the other important shit, like research reports from our lab dudes.{NEWLINE}{NEWLINE}\t\tI browsed it a little and looks like it has some notes on gameplay mechanics unique to the Zone. Maybe read these today evening if you have trouble falling asleep eh?{NEWLINE}{NEWLINE}\t\tAlright, I'll go help out with the cleanup. I'll check back with you in couple hours or so."
  STR_MAIN_BASE: "Our home"
  STR_SQUAT: "Squat"
  STR_SQUAT_KNOWLEDGEBASE: "\t\tKneeling down and standing up costs {ALT}only 3 TUs{ALT}. That's because stalkers don't take a knee for shooting, but squat instead, and years of slav squatting granted them knee flexibility needed for rapid squatting and un-squatting. In addition squatting helps with aiming, {ALT}increasing accuracy by 31%{ALT}."
  STR_ACCURACY_KNOWLEDGEBASE: "\t\tWhen accuracy exceeds 100%, not only the bullet is guaranteed to hit ({ALT}OXCE bug is fixed{ALT}), but also it has a chance to have guaranteed max damage roll depending on how much above 100% the accuracy is."
  STR_HEADSHOTS: "Headshots"
  STR_HEADSHOTS_KNOWLEDGEBASE: "\t\tIn the Zone, it makes a difference if the bullet hits the head. Shots to the head deal more damage since head is not protected by the armor. In addition, headshots deal full stun damage possible without usual randomness.{NEWLINE}{NEWLINE}\t\tAny headgear with {ALT}ARMOR{ALT} value defined will reduce incomming head damage.{NEWLINE}{NEWLINE}\t\tAny bullet that connects has {ALT}16%{ALT} chance to hit head, but somewhere out there there may be highly trained exceptions who aim better."
  STR_CQC: "Close Quarters"
  STR_CQC_KNOWLEDGEBASE1: "\t\tGetting close to a guy and going for a meatshot sounds like a good idea - Not only there's no room for missed shots (literally), but also point blank shots are guaranteed to have high damage rolls. Naturally, the guy that's about to get blasted knows it too, so he'll try to push the barrel away, and the shot will whiff. There may be some exceptions which are uncapable of CQC, but other than that we should advise our stalkers to think before charging.{NEWLINE}{NEWLINE}{ALT}>>{ALT}"
  STR_CQC_KNOWLEDGEBASE2: "\t\tFortunately, CQC formula in the Zone is not as {ALT}poyebana{ALT} as the default one. It goes like this:{NEWLINE}\t- Base chance of having a gun pushed away depends on its inventory size. {ALT}20%{ALT} for 1x2, {ALT}50%{ALT} for 2x2 and 1x3, {ALT}80%{ALT} for 3x2.{NEWLINE}\t- If defender is being shot in the back, substract {ALT}30%{ALT}.{NEWLINE}\t- Add {ALT}(REACTIONS diffrence)*2{ALT} in favour of whoever has more.{NEWLINE}\t- If attacker has more {ALT}STRENGTH{ALT}, substract strength diffrence.{NEWLINE}{NEWLINE}{NEWLINE}{ALT}>>{ALT}"
  STR_CQC_KNOWLEDGEBASE3: "\t\tFor comparison, the default CQC formula works like this:{NEWLINE}\t- To win at CQC, {ALT}the attacker{ALT} has to win a melee roll, not the guy attempting to grab the barrel.{NEWLINE}\t- Base chance of success is {ALT}(MELEE + REACTIONS)/2{ALT}.{NEWLINE}\t- Next up there are several configurable CQC related settings that make it even worse.{NEWLINE}\t- Finally, there's victim's armor's melee dodge which reduces the odds even further.{NEWLINE}\t\tAt this point you're better off shooting {ALT}away{ALT} from the target and have your barrel CQC-pushed {ALT}towards{ALT} the target.{NEWLINE}{NEWLINE}{ALT}Poyebana{ALT}, isn't it?"
  STR_OVERBURDEN: "Overburden"
  STR_OVERBURDEN_KNOWLEDGEBASE: "\t\tHaving a stalker carry more gear than his strength allows will cause him to start a turn with reduced {ALT}max TUs{ALT}."
  STR_MAINTENANCE: "Maintenance"
  STR_MAINTENANCE_KNOWLEDGEBASE: "\t\tIt costs money to keep our equipment in working condition. On average it's {ALT}1000{ALT} monthly per one set of armor or one weapon. It's not much, but it adds up. It's good to keep couple shooters around for home defense, but overdoing it will show up on our bills."
  STR_COVER: "Taking cover"
  STR_COVER_KNOWLEDGEBASE: "\t\tIn the Zone terrain has increased collision, so it's easier to take cover behind it."
  STR_PSI_EMISSIONS: "Psi emissions"
  STR_PSI_EMISSIONS_KNOWLEDGEBASE: "\t\tIn some regions of the Zone, especially around the Brainscorcher, our stalkers have to watch out for psionic emissions. They reduce morale each turn, and if strong enough, will zombify the stalker whose morale dropped to zero."
  STR_RADIATION: "Radiation"
  STR_RADIATION_KNOWLEDGEBASE: "\t\tStalkers will often have to operate in irradiated areas, notably Anomaly Sites. But especially treacherous are artifacts worn on belt, since they irradiate the wearer and bypass any radiation protection provided by the outfit.{NEWLINE}{NEWLINE}\t\tStalker's radiation poisoning tolerance is represented by green bar at the very bottom of the battlescape UI. If that number at any point during the mission reaches zero, the stalker will die from radiation poisoning after the mission ends. From that point onward it's too late for antirads.{NEWLINE}{NEWLINE}\t\tTo prevent this, keep an eye on our stalkers' current radiation poisoning level and have 'em use antirads, or alcohol, before it's too late.{NEWLINE}{NEWLINE}\t\tIf \"The Merry Crew\" submod is active, reaching fatal radiation poisoning will incapacitate the stalker for the remainder of the mission instead."
  STR_DRUNK_DEBUFF: "Drunk Debuff"
  STR_DRUNK_DEBUFF_KNOWLEDGEBASE: "\t\tDrinking alcohol has a drawback. Just like real life. Each stack of drunk debuff lowers stalker's accuracies and reactions by {ALT}5%{ALT} and increases stun damage taken at the beginning of a turn. On the other hand each stack increases bravery by {ALT}5{ALT}. Those stacks wear off, one per turn, so a stalker eventually sobers up if the battle goes on for long enough."
  STR_DMG_TYPES: "Damage types"
  STR_DMG_TYPES_KNOWLEDGEBASE1: "\t\tThere are few parameters which are common to most damage types:{NEWLINE}\t- {ALT}50-150%{ALT} damage variation{NEWLINE}\t- {ALT}10%{ALT} armor damage (even if attack was fully stopped by armor){NEWLINE}\t- {ALT}0-25%{ALT} of damage that pierced armor is also done as stun damage{NEWLINE}\t- May inflict {ALT}0-3{ALT} fatal wounds{NEWLINE}{NEWLINE}\t\tEach damage type has a unique trait, or variation from above rules.{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{ALT}>>{ALT}"
  STR_DMG_TYPES_KNOWLEDGEBASE2: "\t{ALT}BALLISTIC{ALT} - Power drops off with distance. Dropoff range varies between weapons and usually is close to aimed shot accuracy falloff.{NEWLINE}\t{ALT}FIRE{ALT} - Ignores armor and drains morale based on target's bravery (or lack thereof). Being set on fire or standing on fire tile deals {ALT}5-15{ALT} damage at beginning of turn.{NEWLINE}\t{ALT}HIGH EXPLOSIVE{ALT} - Has damage spread of {ALT}75-125%{ALT} instead of usual 50-150%.{NEWLINE}\t{ALT}ELECTRIC{ALT} - Ignores armor and deals stun damage instead of health damage. It also drains time units, making it difficult for target to do reaction fire. If target already doesn't have any TUs, the TU drain carries over to the next turn. Causes no fatal wounds.{NEWLINE}\t{ALT}RUPTURE{ALT} - Causes {ALT}+1{ALT} more fatal wound on every hit that pierces armor.{NEWLINE}\t{ALT}CHEMICAL{ALT} - Deals much more damage to armor, and once it's corroded, causes much more fatal wounds.{NEWLINE}{ALT}>>{ALT}"
  STR_DMG_TYPES_KNOWLEDGEBASE3: "\t{ALT}SMOKE{ALT} - Ignores armor and deals stun damage instead of health damage. Smoke clouds cause deceplively large stun damage if a stalker stands in them at the beginning of a turn.{NEWLINE}\t{ALT}IMPACT{ALT} - Ignores armor, deals {ALT}100%{ALT} stun damage, {ALT}25%{ALT} health damage, {ALT}20%{ALT} stamina damage, causes no fatal wounds.{NEWLINE}\t{ALT}RADIATION{ALT} - Instead of dealing damage, reduces radiation poisoning tolerance. See article on {ALT}Radiation{ALT} for more details."
  STR_INDIVIDUAL_PERSONAL_LIGHT: "Individual Personal Light"
  STR_INDIVIDUAL_PERSONAL_LIGHT_KNOWLEDGEBASE: "\t\tStalkers can turn their personal lights on/off indepentently from each other. Useful during night missions for having the spotter move ahead and illuminate the target while snipers remain in the dark.{NEWLINE}{NEWLINE}\t\tBy default it's bound to '{ALT};{ALT}' key."
  STR_MIDDLECLICK: "Middle click"
  STR_MIDDLECLICK_KNOWLEDGEBASE: "\t\tUsually middle click (or CTRL+MMB once in a while) invokes clicked thing's article in the PDA. In the Zone, this also works for items (and anomalies) on the ground in the battlescape."
  STR_SKILL_SNEAK: "Skill: Sneak"
  STR_SNEAK: "Sneak"
  STR_SNEAK_KNOWLEDGEBASE1: "\t\tWhile sneaking, stalker becomes undetectable from afar. Useful for scouting ahead, moving in flanking positions unseen and starting a shootout on our terms.{NEWLINE}{NEWLINE}\t\tDetection range is reduced to {ALT}10{ALT} tiles in light, {ALT}6{ALT} in dark (may vary depending on outfit), and additional {ALT}-3{ALT} while squatting.{NEWLINE}{NEWLINE}\t\tIn sneak mode melee hits deal guaranteed {ALT}300%{ALT} damage.{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}{ALT}>>{ALT}"
  STR_SNEAK_KNOWLEDGEBASE2: "\t\tActivating sneak mode turns stalker gray to indicate that he is sneaking. Sneak mode will remain active unless stalker gets spotted by the enemy, or hits someone with non-silent weapon.{NEWLINE}{NEWLINE}\t\tIn the next turn, if a stalker blinks gray, the sneak mode will expire at the end of half-turn unless the skill is reactivated. This only happens if stalker moved since activating the sneak mode, which means that camping in one spot will keep sneak mode on indefinitely.{NEWLINE}{ALT}>>{ALT}"
  STR_SNEAK_KNOWLEDGEBASE3: "\t\tSneak mode does not interfere with Opportunity Shots (a.k.a. reaction fire), which is good for setting up sneak attacks, but also may lead to unintentionally revealing self too early."
  STR_SKILL_MEASURE_DISTANCE: "Skill: Measure distance"
  STR_MEASURE_DISTANCE: "Measure distance"
  STR_MEASURE_DISTANCE_KNOWLEDGEBASE: "\t\tActivating the aim mode of this skill will make number next to the cursor display amount of tiles between selected stalker and highlighted tile instead of accuracy."
  STR_SKILL_AIM_HEAD: "Skill: Aim for the head"
  STR_AIM_HEAD: "Aim for the head"
  STR_AIM_HEAD_KNOWLEDGEBASE: "\t\tWhile this skill is active, shooting a gun will cost more TUs, be less accurate, but drastically improve the odds of a bullet hitting head.{NEWLINE}{NEWLINE}\t\tThis skill may be activated and deactivated at will with no cost. Stalker is being recolored gold to indicate that head mode is currently active."
