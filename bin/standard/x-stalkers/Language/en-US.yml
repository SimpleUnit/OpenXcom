en-US:
  STR_CURRENCY: "{0} RU"
  STR_OPENXCOM: "X-Stalkers"
  STR_LOST_IN_SERVICE: "LOST IN THE ZONE"
  STR_AVATAR_NAME_1: "Adidas"
  STR_AVATAR_NAME_2: "Everlast"
  STR_AVATAR_NAME_3: "Gracjan"
  STR_AVATAR_NAME_4: "Skolwin"
  STR_AVATAR_NAME_5: "Maska"
  STR_AVATAR_NAME_6: "Jasny"
  STR_AVATAR_NAME_7: "Bandyta"
  STR_AVATAR_NAME_8: "Rybak"
  STR_1_BEGINNER: "1> Casual"
  STR_2_EXPERIENCED: "2> Easier"
  STR_3_VETERAN: "3> Regular"
  STR_4_GENIUS: "4> Challenging"
  STR_5_SUPERHUMAN: "5> Absurd"
  STR_NONE_KNOWLEDGEBASE: "No armor means no protection from bullets or hazards. Basic clothing only protects from bad weather."
  STR_BANDIT: "Bandit"
  STR_BANDIT_JACKET: "Bandit"
  STR_BANDIT_JACKET_KEVLAR: "Bandit (with cheap kevlar)"
  STR_BANDIT_JACKET_KEVLAR_UC: "Bandit (jacket)"
  STR_BANDIT_JACKET_KNOWLEDGEBASE: "Bandits - ther're in the Zone to get rich. They're mostly criminals and gangers. Some of them are wearing cheap kevlars under their jackets."
  STR_BANDIT_HEAVY: "Bandit (with cobra)"
  STR_BANDIT_HEAVY_UC: "Bandit (with cobra)"
  STR_BANDIT_HEAVY_KNOWLEDGEBASE: "Bandits at some point managed to get their hands on a batch of old Cobra vests, but are using them only for their turf defense."
  STR_BANDIT_COAT: "Bandit Leader"
  STR_BANDIT_COAT_UC: "Bandit (coat)"
  STR_BANDIT_COAT_KNOWLEDGEBASE: "Bandit leaders - they are much more experienced and better informed than common grunts. Since they're higher in the hierarchy, they also get access to berrer equipment, including the armor."
  STR_MILITARY: "Military"
  STR_MILITARY_UC: "Military"
  STR_MILITARY_KNOWLEDGEBASE: "Officially, the army is locking down the Zone and shooting on sight because stalking is illegal. Under the table, it does shady deals with stalkers and accepts bribes. Either way, better not to mess with these guys. Not only because they're well trained and equipped, but also they have the infinite power of government backing them."
  STR_MILITARY_SERGEANT: "Military sergeant"
  STR_MILITARY_SOLDIER: "Military soldier"
  STR_MERCENARY: "Mercenary"
  STR_MERCENARY_UC: "Mercenary"
  STR_MERCENARY_KNOWLEDGEBASE: "Highly trained stalkers carrying out various tasks for the highest bidder. They wear modernized Cobra vests supplemented with basic environment protection suits."
  STR_MONOLIT: "Monolit"
  STR_MONOLIT_ELITE: "Monolit elite"
  STR_MONOLIT_EXO: "Monolit soldier (with exoskeleton)"
  STR_MONOLIT_KNOWLEDGEBASE: "Monolit members are guarding the center of the Zone with limitless devotion. They know no fear. Their outfits have similar parameters to Sunrise rev. 5, except they're more resistant to fire and chemicals."
  STR_MONOLIT_SNIPER: "Monolit sniper"
  STR_MONOLIT_SOLDIER: "Monolit soldier"
  STR_MONOLIT_SOLDIER_PLUS: "Monolit soldier"
  STR_MONOLIT_UC: "Monolit soldier"
  STR_HEAVYMONOLIT: "Monolit soldier (with beryl)"
  STR_HEAVYMONOLIT_KNOWLEDGEBASE: "Better skilled, better equipped and better armored. They're wearing Beryl that went through the same process that makes Monolit outfits more resistant to fire and chemicals."
  STR_HEAVYMONOLIT_PLUS: "Monolit soldier (with beryl)"
  STR_HEAVYMONOLIT_UC: "Monolit soldier (with beryl)"
  STR_STALKER_ROOKIE: "Stalker (rookie)"
  STR_STALKER_ROOKIE_NEUTRAL: "Neutral Stalker (rookie)"
  STR_STALKER_EXPERIENCED: "Stalker (experienced)"
  STR_STALKER_EXPERIENCED_NEUTRAL: "Neutral Stalker (experienced)"
  STR_STALKER_EXPERIENCED_PLUS: "Stalker (experienced)"
  STR_STALKER_EXPERIENCED_PLUS_NEUTRAL: "Neutral Stalker (experienced)"
  STR_HEAVYSTALKER_EXPERIENCED: "Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_NEUTRAL: "Neutral Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_PLUS: "Stalker (with heavy sunrise, experienced)"
  STR_HEAVYSTALKER_EXPERIENCED_PLUS_NEUTRAL: "Neutral Stalker (with heavy sunrise, experienced)"
  STR_BANDIT_GRUNT: "Bandit grunt"
  STR_BANDIT_LEADER: "Bandit leader"
  STR_CHEAP_KEVLAR_UC: "Cheap Kevlar"
  STR_CHEAP_KEVLAR_KNOWLEDGEBASE: "The cheap kevlar shirts can be worn under regular clothes. It gives barely any real protection from bullets, but still can make difference between life and death."
  STR_DAMAGED_CHEAP_KEVLAR_KNOWLEDGEBASE: "Turns out that some of these thugs are wearing some sort of kevlar shirt underneath their jackets. And it is capable of reducing damage from bullets.{NEWLINE}{NEWLINE}We can recover damaged kevlars and make them usable again in our workshop."
  STR_SUNRISE_UC: "Sunrise armor"
  STR_SUNRISE: "Sunrise armor"
  STR_SUNRISE_KNOWLEDGEBASE: "Sunrise armor rev. 5. Compared to previous revisions it is lighter and cheaper while maintaining most of its protective capabilities. Its quality to price ratio makes it the most common outfit in the Zone."
  STR_HEAVYSUNRISE_UC: "Heavy Sunrise armor"
  STR_HEAVYSUNRISE: "Heavy Sunrise armor"
  STR_HEAVYSUNRISE_KNOWLEDGEBASE: "Sunrise armor rev. 4. Offers strong protection against most types of anomalies while having enough bulletproof capabilities to stay relevant in firefights. The material is dense, which makes the outfit heavy."
  STR_HAZMAT_UC: "Hazmat suit"
  STR_HAZMAT: "Hazmat suit"
  STR_HAZMAT_KNOWLEDGEBASE: "{ALT}Closed circuit outfit - forbids drinking.{ALT}{NEWLINE}Specialized outfit for hazardous environments. Makes wearer immune to radiation and all anomalies except Vortex and Springboard. In addition, its visor makes it harder to spot Vortexes and Springboards. On top of that, it makes too much noise to sneak around in it."
  STR_HAZMAT_KASK: "Hazmat suit visor"
  STR_HAZMAT_KASK_KNOWLEDGEBASE: "Integral part of hazmat suit. It slightly blurrs the picture. The visor won't endure harder impacts."
  STR_SEVA_UC: "SEVA suit"
  STR_SEVA: "SEVA suit"
  STR_SEVA_KNOWLEDGEBASE: "{ALT}Closed circuit outfit - forbids drinking.{ALT}{NEWLINE}Elite outfit for hazardous environments. Offers strong anomaly protection and bulletproof capabilities comparable to Sunrise rev.5. Very expensive."
  STR_SEVA_KASK: "SEVA suit visor"
  STR_SEVA_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}10{ALT}{NEWLINE}{NEWLINE}Integral part of SEVA suit. Despite slight tint does not impair vision and its thickness gives it small chance of stopping a bullet."
  STR_COBRA_UC: "Cobra vest"
  STR_COBRA: "Cobra vest"
  STR_COBRA_KNOWLEDGEBASE: "Outdated, but still capable bulletproof vest. Unpopular amongst stalkers due to lack of protection from environmental hazards."
  STR_BERYL_UC: "Beryl armor"
  STR_BERYL: "Beryl armor"
  STR_BERYL_KNOWLEDGEBASE: "Heavy armor designed for military operations. Grants superior bulletproof protection, but almost no anomaly protection."
  STR_EXO_UC: "Exoskeleton"
  STR_EXO: "Exoskeleton"
  STR_EXO_KNOWLEDGEBASE: "Turns wearer into a walking tank. Consists of heavy metal plating and sophisticated hydraulics circuitry which allows wearer to move despite the armor's weight. Susceptible to anomalies, notably Electro being particulary dangerous to the wearer."
  STR_EXO_KASK: "Exoskeleton headgear"
  STR_EXO_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}20{ALT}{NEWLINE}{NEWLINE}Integral part of exoskeleton. Is bulletproof (including the face part) and has standard gas mask build in."
  STR_KASK: "Steel helmet"
  STR_KASK_UC: "Steel helmet article"
  STR_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}20{ALT}{NEWLINE}REACTIONS: {ALT}-10{ALT}{NEWLINE}{NEWLINE}A helmet. Wear it on head, and it keeps bullet away. Unless hit in the face. Steel helmets are uncommon sight among stalkers because they're uncomfortable, heavy and they impair awareness."
  STR_COMBAT_KASK: "Combat helmet"
  STR_COMBAT_KASK_UC: "Combat helmet article"
  STR_COMBAT_KASK_KNOWLEDGEBASE: "ARMOR: {ALT}15{ALT}{NEWLINE}{NEWLINE}Proper military head protection. Not too uncomfortable."
  STR_SZKOŁA_1: "Workshop"
  STR_SZKOŁA_2: "Research rooms"
  STR_SZKOŁA_3: "Living quarters"
  STR_SZKOŁA_4: "Storage room"
  STR_SZKOŁA_5: "Guests section"
  STR_SZKOŁA_6: "Captives cellar"
  STR_COMPOUND: "Compound"
  STR_CAMP: "Central part"
  STR_SZKOŁA_1_KNOWLEDGEBASE: "This is where we do our crafting."
  STR_SZKOŁA_2_KNOWLEDGEBASE: "This is where our eggheads examine what we bring 'em."
  STR_SZKOŁA_3_KNOWLEDGEBASE: "This is where we rest between raids. We have room for 40 guys and no more. We can't just build more rooms. Keep that in mind when recruiting people."
  STR_SZKOŁA_4_KNOWLEDGEBASE: "This is our storage. Our storage capacity is capped at 100 units since we don't have capabilities to build any warehouses or anything. 100 should be more than enough to meet our needs."
  STR_SZKOŁA_5_KNOWLEDGEBASE: "This is where we accomodate our guests. When we rescue some stalkers in need, or when someone randomly comes and asks for accomodation, this is where you can check them out. We have room for 11 guests."
  STR_SZKOŁA_6_KNOWLEDGEBASE: "This is where we keep our captives, stalkers or smaller animals. Our cellars can hold up to 8 of those."
  STR_SETUP_CAMPS: "Setting up camps"
  STR_SETUP_CAMPS_KNOWLEDGEBASE: "The Zone is big, so if we want to run our operations effectively, we should set up a network of camps.{NEWLINE}{NEWLINE}We can set up camps in most of the Zone, but it doesn't mean we should. Before you set up in an area, make sure that our stalkers are trained and equipped enough to take on local dangers. Keep in mind that our camps are at risk of being raided, so don't leave it undefended.{NEWLINE}{NEWLINE}Disassembling a camp is as easy as setting it up and we get a full refund, so don't hesitate to leave area you aren't interested in."
  STR_TENT_KNOWLEDGEBASE: "One tent provides room for 5 stalkers and 5 storage capacity, independently from limits of our main base. 5 storage is not much, but should be enough to store campers' guns and ammo. Tents are not suitable to do any research or crafting, so if camp team wins a battle, either sell the loot or transfer it to our main base."
  STR_EXPEDITION_SMALL: "SMALL EXPED."
  STR_EXPEDITION_SMALL_FULL: "Small Expedition"
  STR_EXPEDITION_SMALL_KNOWLEDGEBASE: "Smaller, more agile expedition. Good for covering larger areas. Can catch up to other small expeditions, but gets outnumbered by large ones.{NEWLINE}{NEWLINE}Stalkers: {ALT}3{ALT}{NEWLINE}Speed: {ALT}FAST{ALT}{NEWLINE}Sight range: {ALT}FAR{ALT}"
  STR_EXPEDITION_LARGE: "LARGE EXPED."
  STR_EXPEDITION_LARGE_FULL: "Large Expedition"
  STR_EXPEDITION_LARGE_KNOWLEDGEBASE: "Larger expedition is more suited for battle than for scouting. Good for raiding camps and scavenging.{NEWLINE}{NEWLINE}{NEWLINE}Stalkers: {ALT}7{ALT}{NEWLINE}Speed: {ALT}SLOW{ALT}{NEWLINE}Sight range: {ALT}MEDIUM{ALT}"
  STR_EXCURSION: "EXCURSION"
  STR_EXCURSION_FULL: "Excursion"
  STR_EXCURSION_KNOWLEDGEBASE: "This is not really an expedition. It's more like sending a bunch of boys out there to kick ass. It's range is limited to more or less sight range of a camp.{NEWLINE}{NEWLINE}Stalkers: {ALT}16{ALT}{NEWLINE}Speed: {ALT}EXPRESS{ALT}{NEWLINE}Sight range: {ALT}NEAR{ALT}{NEWLINE}{ALT}Limited range{ALT}"
  STR_CHEAP_KEVLAR: "Cheap Kevlar"
  STR_FIST: "Fist"
  STR_FIST_KNOWLEDGEBASE: "The go-to problem solving tool on the streets. In the Zone there are more effective solutions for melee diplomacy, such as knife or butt of a rifle."
  STR_KNIFE: "Knife"
  STR_KNIFE_KNOWLEDGEBASE: "Primary survival tool. Don't go anywhere without it. Seriously, almost everyone in the Zone has a knife."
  STR_CONTACT_CHEAP_KEVLAR_DEALER: "Contact: cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_LOCATION: "Cheap kevlar dealer location"
  STR_CONTACT_CHEAP_KEVLAR_DEALER_NOT: "Contact: cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER: "Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_C: "[COMPLETED] Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_NOC: "[COMPLETED] Cheap kevlar dealer"
  STR_CHEAP_KEVLAR_DEALER_C_KNOWLEDGEBASE: "We found the guy making those cheap kevlars. He lives somewhere in Zaton. He can provide us with cheap kevlars, as long as we have cash."
  STR_CHEAP_KEVLAR_DEALER_NOC_KNOWLEDGEBASE: "We found the guy making those cheap kevlars. That's the good news. The bad news is that he won't be dealing with us. I dunno, our boys came to his little hut and he freaked out on them, shouting something about messengers of devil and all that. Best they could to is to smash his face in and steal couple shirts he had lying around.{NEWLINE}{NEWLINE}So now our only source of these kevlar shirts is to steal them from bandits. Guess we can't have it too easy on absurd difficulty, eh?"
  STR_CHEAP_KEVLAR_DEALER_KNOWLEDGEBASE: "Somewhere in the Zone there is a guy that makes these cheap kevlar shirts the bandits are wearing. He's not affiliated with the bandits, so if we can find him, maybe we can buy these kevlars for ourselves.{NEWLINE}{NEWLINE}First, we'll have to find out where he lives. For that we should interrogate a bandit leader. And if we don't have a leader, maybe one of those grunts happen to know anything."
  STR_BASIC_GUNS_DEAL: "Find a deal for basic guns"
  STR_BASIC_GUNS_DEAL_KNOWLEDGEBASE: "We found suppliers of basic equipment, but that's not enough if we're going big in the Zone. We need to find suppliers of better guns. Maybe not RPGs and HMGs right off the bat, but something commonly available out here. If we reach out to one of the factions, maybe they will trade with us. Other option is to interrogate bandit leaders and make them tell us about their suppliers. Leaders are those guys in coats."
  STR_BASIC_GUNS_DEAL_PREQ: "Basic guns deal opportunity"
  STR_STRIKE_BASIC_GUNS_DEAL: "Basic guns deal"
  STR_BASIC_GUNS_DEAL_C: "[COMPLETED] Basic guns deal"
  STR_BASIC_GUNS_DEAL_C_KNOWLEDGEBASE: "Now we can buy Vipers, Saw-offs and basic ammunition. It's not much, but it should help us survive until we find better shooters."
  STR_SUNRISE_DEAL: "Find a deal for Sunrise armor"
  STR_SUNRISE_DEAL_KNOWLEDGEBASE: "Every other stalker in the Zone is dressed up in Sunrise, which means they are commonly available. We should secure a supply of these. Maybe if we ask around among experienced stalkers they will tell us about some vendors."
  STR_SUNRISE_DEAL_PREQ: "Sunrise armor deal opportunity"
  STR_STRIKE_SUNRISE_DEAL: "Sunrise armor deal"
  STR_SUNRISE_DEAL_C: "[COMPLETED] Sunrise armor deal"
  STR_SUNRISE_DEAL_C_KNOWLEDGEBASE: "We found a place not too far where we can buy Sunrise armors."
  STR_BETTER_GUNS_DEAL: "Find a deal for better guns"
  STR_BETTER_GUNS_DEAL_KNOWLEDGEBASE: "Ok, we have some shooters in the armory. Now let's find suppliers for something stronger. To get access to better deals, we need to become major players.{NEWLINE}{NEWLINE}Maybe we'll get their attention if we achieve 5 000 monthly rating."
  STR_STRIKE_BETTER_GUNS_DEAL: "Better guns deal"
  STR_BETTER_GUNS_DEAL_C: "[COMPLETED] Better guns deal"
  STR_BETTER_GUNS_DEAL_C_KNOWLEDGEBASE: "Now that we have some good contacts of our own, we can buy some serious gear for some serious business."
  STR_ELITE_GUNS_DEAL: "Find a deal for elite guns"
  STR_ELITE_GUNS_DEAL_KNOWLEDGEBASE: "So far we don't have to worry about access to shooters. But at some point we might have to fight our way to the center of the Zone. Before that happens, let's keep an eye for opportunities to get access to biggest, baddest guns in the Zone to equip our expedition with."
  STR_STRIKE_ELITE_GUNS_DEAL: "Elite guns deal"
  STR_STRIKE_ELITE_GUNS_DEAL_NOT: "Elite guns deal"
  STR_ELITE_GUNS_DEAL_C: "[COMPLETED] Elite guns deal"
  STR_ELITE_GUNS_DEAL_NOC: "[COMPLETED] Elite guns deal"
  STR_ELITE_GUNS_DEAL_C_KNOWLEDGEBASE: "I don't know how did you pull it off, but you managed to arrange access to the best guns in the Zone."
  STR_ELITE_GUNS_DEAL_NOC_KNOWLEDGEBASE: "Welp... That was to be expected. Life would be too easy if there was anyone willing to sell us all that elite gear."
  STR_HIGHSCORE_MILESTONE: "(achieve 5000 monthly rating)"
  STR_INAVAILABILITOR: "(special)"
  STR_HIGHSCORE_EVENT: "Major league."
  STR_HIGHSCORE_EVENT_DESC: "Nice work, boss. Achieving a monthly rating that high means we're a major player now. Which means we can start hangin' out with other major players."
  STR_PM: "PM"
  STR_PM_UC: "PM article"
  STR_PM_KNOWLEDGEBASE: "PM stands for 'Pistolet Makarova'. It's cheap, common, and weak. But still it's better than throwing rocks."
  STR_PM_S: "Noiseless PM"
  STR_PM_S_UC: "Noiseless PM article"
  STR_PM_S_KNOWLEDGEBASE: "Variant of PM with integrated silencer."
  STR_PM_CLIP: "PM clip"
  STR_PM_AP_CLIP: "PM clip (armor piercing)"
  STR_USP: "Compact pistol"
  STR_USP_S: "Compact pistol [S]"
  STR_USP_S-: "Compact pistol [-S]"
  STR_USP_UC: "Compact pistol article"
  STR_USP_KNOWLEDGEBASE: "All-round upgrade compared to PM. Can have a silencer attached if you find one somewhere."
  STR_USP_CLIP: "Compact pistol clip"
  STR_SAWOFF: "Sawn-off shotgun"
  STR_SAWOFF_UC: "Sawn-off shotgun article"
  STR_SAWOFF_KNOWLEDGEBASE: "Mind fixed TU cost. Common weapon seen in rookies' hands, but can be used by pros as a sidearm carried on belt for sudden close encounters. Due to shortened barrel the buckshot spread is large and damage falls off rapidly."
  STR_DBSHOTGUN: "Double barrel shotgun"
  STR_DBSHOTGUN_UC: "Double barrel shotgun article"
  STR_DBSHOTGUN_KNOWLEDGEBASE: "Keeps boars and bandits off your lawn. Surprisingly effective at long ranges tue to long barrels."
  STR_WINCHESTER: "Pump action shotgun"
  STR_WINCHESTER_UC: "Pump action shotgun article"
  STR_WINCHESTER_KNOWLEDGEBASE: "Your typical pump-action shotgun."
  STR_SPAS: "Auto shotgun"
  STR_SPAS_UC: "Auto shotgun article"
  STR_SPAS_KNOWLEDGEBASE: "Solid close range weapon, especially in hands of pros with large TU pool."
  STR_ELIMINATOR: "Eliminator shotgun"
  STR_ELIMINATOR_UC: "Eliminator shotgun article"
  STR_ELIMINATOR_KNOWLEDGEBASE: "The ultimate shotgun available in the Zone. Long reload time is its major weakness."
  STR_AMMO_2BS: "Shotgun shells (buckshot, 2)"
  STR_AMMO_2AP: "Shotgun shells (armor piercing, 2)"
  STR_VIPER: "Viper SMG"
  STR_VIPER_UC: "Viper SMG article"
  STR_VIPER_KNOWLEDGEBASE: "The most affordable automatic weapon in the Zone."
  STR_VIPER_CLIP: "Viper clip"
  STR_VIPER_AP_CLIP: "Viper clip (armor piercing)"
  STR_AK74: "Short rifle"
  STR_AK74_S: "Short rifle [S]"
  STR_AK74_S-: "Short rifle [-S]"
  STR_AK74_UC: "Short rifle article"
  STR_AK74_KNOWLEDGEBASE: "Spits bullets fast, but has low accuracy and range. Shines the most at close to mid ranges."
  STR_OBOKAN: "Service rifle"
  STR_OBOKAN_G: "Service rifle [G]"
  STR_OBOKAN_S: "Service rifle [S]"
  STR_OBOKAN_GS: "Service rifle [GS]"
  STR_OBOKAN_G+S: "Service rifle [GS]"
  STR_OBOKAN_S+G: "Service rifle [GS]"
  STR_OBOKAN_G-: "Service rifle [-G]"
  STR_OBOKAN_S-: "Service rifle [-S]"
  STR_OBOKAN_GS-: "Service rifle [-GS]"
  STR_OBOKAN_UC: "Service rifle article"
  STR_OBOKAN_KNOWLEDGEBASE: "Reliable rifle with average parameters, performs well in most situations."
  STR_AKM: "Modernized rifle"
  STR_AKM_G: "Modernized rifle [G]"
  STR_AKM_S: "Modernized rifle [S]"
  STR_AKM_GS: "Modernized rifle [GS]"
  STR_AKM_G+S: "Modernized rifle [GS]"
  STR_AKM_S+G: "Modernized rifle [GS]"
  STR_AKM_G-: "Modernized rifle [-G]"
  STR_AKM_S-: "Modernized rifle [-S]"
  STR_AKM_GS-: "Modernized rifle [-GS]"
  STR_AKM_UC: "Modernized rifle article"
  STR_AKM_KNOWLEDGEBASE: "Better accuracy and range, but slower rate of fire. Better suited for outdoors shootouts where distances are longer."
  STR_GROZA: "Thunder rifle"
  STR_GROZA_UC: "Thunder rifle article"
  STR_GROZA_KNOWLEDGEBASE: "Advanced top-tier rifle with integrated grenade launcher."
  STR_AMMO_WP: "5.45 clip"
  STR_AMMO_WP_AP: "5.45 clip (armor piercing)"
  STR_AMMO_WP_UC: "5.45 clip article"
  STR_AMMO_WP_KNOWLEDGEBASE: "This one is for:{NEWLINE}- Short rifle{NEWLINE}- Service rifle{NEWLINE}- Modernized rifle{NEWLINE}- Thunder rifle"
  STR_BULLDOG: "Bulldog grenade launcher"
  STR_BULLDOG_UC: "Bulldog grenade launcher article"
  STR_BULLDOG_KNOWLEDGEBASE: "Shoots VOG grenades. Deals a lot of damage, but the ammunition is expensive. Use wisely."
  STR_GL_WP: "VOG underbarrel grenade launcher"
  STR_UGL_WP: "VOG underbarrel grenade launcher"
  STR_UGL_WP_UC: "VOG underbarrel grenade launcher article"
  STR_UGL_WP_KNOWLEDGEBASE: "Underbarrel grenade launcher attachable to:{NEWLINE}- Service rifle{NEWLINE}- Modernized rifle{NEWLINE}{NEWLINE}It's meant to be attached, but noone said you can't use it on its own."
  STR_GRENADE_WP: "VOG grenade"
  STR_GRENADE_WP_UC: "VOG grenade article"
  STR_GRENADE_WP_KNOWLEDGEBASE: "This one is for Bulldog and for attachment to:{NEWLINE}- Service rifle{NEWLINE}- Modernized rifle{NEWLINE}- Thunder rifle"
  STR_LR300: "Light rifle"
  STR_LR300_G: "Light rifle [G]"
  STR_LR300_S: "Light rifle [S]"
  STR_LR300_GS: "Light rifle [GS]"
  STR_LR300_G+S: "Light rifle [GS]"
  STR_LR300_S+G: "Light rifle [GS]"
  STR_LR300_G-: "Light rifle [-G]"
  STR_LR300_S-: "Light rifle [-S]"
  STR_LR300_GS-: "Light rifle [-GS]"
  STR_LR300_UC: "Light rifle article"
  STR_LR300_KNOWLEDGEBASE: "It's above-average rate of fire and below-average accuracy at long ranges makes this shooter a good choice for run&gunning."
  STR_SIG: "Siege rifle"
  STR_SIG_G: "Siege rifle [G]"
  STR_SIG_S: "Siege rifle [S]"
  STR_SIG_GS: "Siege rifle [GS]"
  STR_SIG_G+S: "Siege rifle [GS]"
