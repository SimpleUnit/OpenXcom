  STR_ZOMB1_UC: "Zombified"
  STR_ZOMB_KNOWLEDGEBASE: "{NEWLINE}{NEWLINE}{NEWLINE}{NEWLINE}\t\tVictim of prolonged exposure to psionic emissions. Zombification caused by this erased his memory and most of his skills. This process is irreversible."
  STR_LOOT_SCAVENGED: "{0} Items recovered"
  STR_KEY1: "Key"
  STR_DOOR1: "Locked Door"
  STR_DOOR2: "Locked Door (Lock's jammed)"
  STR_SEWING_KIT: "Sewing Kit"
  STR_SEWING_KIT_KNOWLEDGEBASE: "\t\tPins, needles and strings, packed in old cookie box. Can be found in every babushka's house.{NEWLINE}{NEWLINE}\t\tYou're laughing, but this kit will allow us to pull off some armor repairs and upgrades which need finesse that simply cannot be achieved with nails, bolts & duct tape."
  STR_TOOLS_ROUGH: "Tools for rough work"
  STR_TOOLS_ROUGH_KNOWLEDGEBASE: "\t\tTools are surprisingly hard to come by in the Zone. We have this one kit for keeping, an any other one our guys find out there we can sell at high price.{NEWLINE}{NEWLINE}\t\tThis kit should help us build the antenna to communicate with other factions, and also is enough to do some weapon upgrades, if we can hire a weaponsmith."
