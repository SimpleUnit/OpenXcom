  STR_L85_S-: "Longbow rifle [-S]"
  STR_L85_GS-: "Longbow rifle [-GS]"
  STR_L85_UC: "Longbow rifle article"
  STR_L85_KNOWLEDGEBASE: "Has integrated scope and very accurate single shot, but firing in bursts is problematic due to recoil."
  STR_F2000: "Millenium rifle"
  STR_F2000_UC: "Millenium rifle article"
  STR_F2000_KNOWLEDGEBASE: "One of the best shooters available in the Zone. Expensive, but worth it. Has integrated scope and grenade launcher."
  STR_AMMO_NATO: "5.56 clip"
  STR_AMMO_NATO_AP: "5.56 clip (armor piercing)"
  STR_AMMO_NATO_UC: "5.56 clip article"
  STR_AMMO_NATO_KNOWLEDGEBASE: "This one is for:{NEWLINE}- Light rifle{NEWLINE}- Siege rifle{NEWLINE}- Longbow rifle{NEWLINE}- Millenium rifle"
  STR_GL_NATO: "M203 underbarrel grenade launcher"
  STR_UGL_NATO: "M203 underbarrel grenade launcher"
  STR_UGL_NATO_UC: "M203 underbarrel grenade launcher article"
  STR_UGL_NATO_KNOWLEDGEBASE: "Underbarrel grenade launcher attachable to:{NEWLINE}- Light rifle{NEWLINE}- Siege rifle{NEWLINE}- Longbow rifle{NEWLINE}{NEWLINE}It's meant to be attached, but noone said you can't use it on its own."
  STR_GRENADE_NATO: "M203 grenade"
  STR_GRENADE_NATO_UC: "M203 grenade article"
  STR_GRENADE_NATO_KNOWLEDGEBASE: "This one is for attachment to:{NEWLINE}- Light rifle{NEWLINE}- Siege rifle{NEWLINE}- Longbow rifle{NEWLINE}- Millenium rifle"
  STR_ASVAL: "Noiseless rifle"
  STR_ASVAL_UC: "Noiseless rifle article"
  STR_ASVAL_KNOWLEDGEBASE: "Assault variant of Vintage rifle. It has detached scope and burst fire capability."
  STR_VINTOREZ: "Vintage rifle"
  STR_VINTOREZ_UC: "Vintage rifle article"
  STR_VINTOREZ_KNOWLEDGEBASE: "Noiseless, fireless sniper rifle, firing subsonic rounds. Falls off at longer ranges."
  STR_AMMO_939: "9.39 clip"
  STR_AMMO_939_AP: "9.39 clip (armor piercing)"
  STR_AMMO_939_UC: "9.39 clip article"
  STR_AMMO_939_KNOWLEDGEBASE: "This one is for:{NEWLINE}- Vintage rifle{NEWLINE}- Noiseless rifle"
  STR_MOSIN: "Bolt action rifle"
  STR_MOSIN_UC: "Bolt action rifle article"
  STR_MOSIN_KNOWLEDGEBASE: "Old, but is still capable of firing bullets. Thanks to integrated scope its somewhat suitable for sniping."
  STR_MOSIN_CLIP: "Bolt action rifle ammo"
  STR_SVU: "Sniper rifle"
  STR_SVU_UC: "Sniper rifle article"
  STR_SVU_KNOWLEDGEBASE: "One of few sniper rifles available in the Zone."
  STR_SVU_CLIP: "Sniper rifle clip"
  STR_MOLOTOV: "Molotov Cocktail"
  STR_MOLOTOV_KNOWLEDGEBASE: "Light it up, throw and it will burn your enemies. Or light up dark area. {NEWLINE}{NEWLINE}When you light it up it will explode instantly after throwing."
  STR_LIGHT_UP: "Light it up"
  STR_ITS_LIT: "It's lit"
  STR_WEAK_GRENADE: "HE grenade"
  STR_WEAK_GRENADE_UC: "HE grenade article"
  STR_WEAK_GRENADE_KNOWLEDGEBASE: "Hand grenade, explodes after set amount of half-turns."
  STR_FRAG_GRENADE: "Frag grenade"
  STR_FRAG_GRENADE_UC: "Frag grenade article"
  STR_FRAG_GRENADE_KNOWLEDGEBASE: "Hand grenade, explodes after set amount of half-turns."
  STR_SILENCER_USP: "Silencer for Compact pistol"
  STR_SILENCER_WP: "5.45 silencer"
  STR_SILENCER_NATO: "5.56 silencer"
  STR_BOLTS: "Box of bolts"
  STR_BOLTS_KNOWLEDGEBASE: "This is convenient way to deal with anomalies. Bolts can be thrown to discharge anomalies from safe distance before swooping in, or scout uncertain tiles.{NEWLINE}{NEWLINE}Careful not to accidentaly throw the entire box."
  STR_ANTIRAD: "Antiradiation drugs"
  STR_ANTIRAD_KNOWLEDGEBASE: "Cures radiation poisoning. All {ALT}100 rads{ALT} cured in one dose."
  STR_KOMANDOS: "Komandos wine"
  STR_KOMANDOS_KNOWLEDGEBASE: "The cheapest wine out there. Tastes like sulfur and apples. Not as strong as vodka in terms of curing radiation poisoning ({ALT}4 rads{ALT}) or getting you drunk ({ALT}1 stack{ALT}), but it still makes your mind go numb enough, making it more suitable for recovering morale and countering psionic emissions."
  STR_DRINK: "Drink"
  STR_KOZAK: "Cossacks vodka"
  STR_KOZAK_KNOWLEDGEBASE: "It's vodka. You drink it. You can use it as emergency cure for radiation poisoning ({ALT}15 rads{ALT}) if you want to preserve antirads. Or drown your worries away, a.k.a. restore a little bit of morale. Applies {ALT}3 stacks{ALT} of drunk debuff."
  STR_CANTEEN: "Canteen"
  STR_CANTEEN_KNOWLEDGEBASE: "Tired? Hungover? Drink! It recovers {ALT}20 stamina{ALT} and removes {ALT}5 stun damage{ALT}.{NEWLINE}{NEWLINE}It's filled with clean, drinkable water naturally."
  STR_ENERGYDRINK: "Energy Drink"
  STR_ENERGYDRINK_KNOWLEDGEBASE: "Generic energy drink made of sugar, caffeine, vitamins and sugar. Recovers {ALT}50 energy, 15 stun and removes two stacks of drunk debuff{ALT}. If used while sober, adds stack in the other way, thus increasing stats.{NEWLINE}{NEWLINE}Don't try mixing alcohol and energy drinks at home. Our stalkers are highly trained slavs capable of surviving in the Zone and can do it safely."
  STR_BANDAGE: "Bandage"
  STR_BANDAGE_KNOWLEDGEBASE: "Each use removes {ALT}3 fatal wounds{ALT} and recovers {ALT}1 HP{ALT}. Use it to quickly stop bleeding and survive until treatment with an actual medkit. Can be used on self and on others, including downed enemies if you want to capture them alive."
  STR_MEDKIT: "Medkit"
  STR_MEDKIT_KNOWLEDGEBASE: "The medkits in this mod {ALT}recover HP even if there are no fatal wounds on the patient{ALT}. The major difference from X-COM. But the usage is still the same.{NEWLINE}Stand next to the patient and turn in his direction, then use medkit. To revive someone unconscious, stand directly over his body and then use.{NEWLINE}{NEWLINE}{ALT}HEAL{ALT}: recovers 5 HP and removes 1 fatal wound.{NEWLINE}{ALT}STIMULANT{ALT}: recovers 10 stamina and removes 10 stun damage.{NEWLINE}{ALT}PAINKILLER{ALT}: recovers 10 morale, plus morale based on missing health."
  STR_SHOVEL: "Shovel"
  STR_SHOVEL_KNOWLEDGEBASE: "You dig holes with it. Dig a ditch to hide in when you want to have a firefight in open field or set up an ambush.{NEWLINE}{NEWLINE}Or use it as a blunt weapon and KO someone. Works better than butt of a rifle."
  STR_AMMO_BOX: "Ammo box"
  STR_AMMO_BOX_KNOWLEDGEBASE: "Holds up to 10 clips of ammunition. Useful for very long expeditions where there's a lot of shooting ahead and no opportunities to loot more ammo on the way.{NEWLINE}{NEWLINE}Taking clips to/from box is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_SHELL_BOX: "Shotgun shell box"
  STR_SHELL_BOX_KNOWLEDGEBASE: "Holds up to 32 shotgun shells. Useful for very long expeditions where there's a lot of shooting ahead and no opportunities to loot more ammo on the way.{NEWLINE}{NEWLINE}Taking shells to/from box is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_ARTIFACT_CONTAINER: "Artifact container"
  STR_ARTIFACT_CONTAINER_KNOWLEDGEBASE: "Holds up to 6 artifacts. Can be used to efficiently gather artifacts from anomaly site. Artifacts inside container do not emit radiation or grant any bonuses to the carrier, even if the container is equipped on belt.{NEWLINE}{NEWLINE}Taking artifacts to/from container is done similar to loading/unloading a firearm. To unload, grab the container on the inventory screen and drop it onto 'Unload weapon' icon to the right, or click it with LMB while holding SHIFT."
  STR_LOCKED_ARTIFACT_CONTAINER: "Locked artifact container"
  STR_LOCKED_ARTIFACT_CONTAINER_KNOWLEDGEBASE: "The artifact containers have a lock which can be locked/unlocked with right combination... or right tools. Give these to our guys at the workshop so they can open them without damaging the artifacts inside."
  STR_WALLET: "Wallet"
  STR_MONEY: "Money"
  STR_MONEY_50: "Money bill (50)"
  STR_MONEY_100: "Money bill (100)"
  STR_MONEY_200: "Money bill (200)"
  STR_MONEY_500: "Money bill (500)"
  STR_MONEY_1000: "Money bill (1000)"
  STR_MONEY_: "Money"
  STR_MONEY_KNOWLEDGEBASE: "Most stalkers have some money on them to buy supplies with. We can sell money bills to add them to our funding."
  STR_DIG: "Dig"
  STR_ANOMALIES_ARTIFACTS: "Anomalies and Artifacts"
  STR_KOTLET: "Kotlet"
  STR_KOTLET_KNOWLEDGEBASE: "RADIATION: -4 R/t{NEWLINE}EFFECT: Absorbs radiation.{NEWLINE}{NEWLINE}Common artifact made by Springboard anomaly. Looks like a kotlet, hence the name. It's consistence resembles rubber."
  STR_BEAD: "Bead"
  STR_BEAD_KNOWLEDGEBASE: "RADIATION: 5 R/t{NEWLINE}EFFECT: Reduces damage from EXPLOSIVE, IMPACT and ELECTRIC by 20%, as well as reduces STUN damage taken in general.{NEWLINE}{NEWLINE}Artifact made by Springboard anomaly. Kinda looks like three metal rods tangled together like a bead. And it's just as hard as metal rods. These 'beads' cannot be untangled."
  STR_SPIRAL: "Spiral"
  STR_SPIRAL_KNOWLEDGEBASE: "RADIATION: 7 R/t{NEWLINE}EFFECT: Reduces damage from BALLISTIC by 10%{NEWLINE}{NEWLINE}Rare artifact made by Springboard anomaly. Creates roughly 1cm thick layer of gravitational disturbance around it. This layer can extend to cover person carrying it. Stalkers claim that you can 'feel' this field as you move."
  STR_TULLIP: "Tullip"
  STR_TULLIP_KNOWLEDGEBASE: "RADIATION: 3 R/t{NEWLINE}EFFECT: Reduces damage from RUPTURE by 10% and reduces chance to get fatal wounds.{NEWLINE}{NEWLINE}Common artifact made by Vortex anomaly. Has consistency of a balloon. And has similar smell."
  STR_PASTA: "Pasta"
  STR_PASTA_KNOWLEDGEBASE: "RADIATION: -6 R/t{NEWLINE}EFFECT: Absorbs radiation.{NEWLINE}{NEWLINE}Artifact made by Vortex anomaly. Resembles a handful of pasta stuck together. It's elastic, but very resistant to stretching - the 'strings' cannot be ripped out by hand."
  STR_HEART: "Heart"
  STR_HEART_KNOWLEDGEBASE: "RADIATION: 7 R/t{NEWLINE}EFFECT: Reduces damage by 4{NEWLINE}{NEWLINE}Rare artifact made by Vortex anomaly. It feels warm to the touch, and the warmth felt extends to the rest of the body if the artifact is held long enough."
  STR_SHARD: "Shard"
  STR_SHARD_KNOWLEDGEBASE: "RADIATION: 3 R/t{NEWLINE}EFFECT: Reduces damage from CHEMICAL by 25% and heals 2 HP.{NEWLINE}{NEWLINE}Common artifact made by Kvass anomaly. Creates small aura around it, which visibly reduces effectiveness of Kvass discharge. Creates pretty lightshow if you shine a flashlight through it."
  STR_EMERALD: "Emerald"
  STR_EMERALD_KNOWLEDGEBASE: "RADIATION: 5 R/t{NEWLINE}EFFECT: Grants +10 BRAVERY, +10 PSI STRENGTH{NEWLINE}{NEWLINE}Artifact made by Kvass anomaly. At first sight you would think it's an actual emerald, but this artifact is heavier. It has psychoactive properties - it induces the feeling of courage and confidence. And it noticably lowers unpleasant sensation caused by psionic emmisions."
  STR_SNOT: "Snot"
  STR_SNOT_KNOWLEDGEBASE: "RADIATION: 7 R/t{NEWLINE}EFFECT: Lowers max TUs by 4, but reduces costs of all actions by 3 TUs.{NEWLINE}{NEWLINE}Rare artifact made by Kvass anomaly. Has consistency similar to a gelatine, but it's high integrity makes it impossible to tear it to smaller pieces. It disturbs perception of reality - it makes it seem as if the time passed slower near it, but this feeling is caused by specific stimulation of nervous system, rather than disturbance of time-space continuum."
  STR_RAISIN: "Raisin"
  STR_RAISIN_KNOWLEDGEBASE: "RADIATION: 3 R/t{NEWLINE}EFFECT: Adds 4-12 ELECTRIC damage to melee attacks.{NEWLINE}{NEWLINE}Common artifact made by Electro. Looks like oversized raisin, except it's blue. It accumulates electrostatic charge over time, which can be released by impact or sudden movement."
  STR_BATTERY: "Battery"
  STR_BATTERY_KNOWLEDGEBASE: "RADIATION: 5 R/t{NEWLINE}EFFECT: Grants +9 TUs, recovers 8 STAMINA and 4 STUN{NEWLINE}{NEWLINE}Artifact made by Electro anomaly. It stimulates the organism and increases vigor. The pointy edges are surprisingly sharp."
  STR_ATOM: "Atom"
  STR_ATOM_KNOWLEDGEBASE: "RADIATION: 7 R/t{NEWLINE}EFFECT: Grants +3 TUs, +5 REACTIONS, +5 ACCURACY.{NEWLINE}{NEWLINE}Rare artifact made by Electro anomaly. It emits dim light. The particles orbiting it pass through solid objects."
  STR_DROPLET: "Droplet"
  STR_DROPLET_KNOWLEDGEBASE: "RADIATION: 3 R/t{NEWLINE}EFFECT: Reduces damage drom FIRE by 25% and heals 2 fatal wounds.{NEWLINE}{NEWLINE}Common artifact made by Burner anomaly. When rubbed against any rugged surface (or another Droplet) hard enough, it creates sparkles which may ignite fire. They can start a fire in our base if dropped on the table too hard. Be careful, will ya?"
  STR_FIREBALL: "Fireball"
  STR_FIREBALL_KNOWLEDGEBASE: "RADIATION: 5 R/t{NEWLINE}EFFECT: Heals 1 HP and 1 fatal wound. If there are no fatal wounds, heals 4 HP instead.{NEWLINE}{NEWLINE}Artifact made by Burner anomaly. It feels warm to the touch. There is a liquid core inside semi transparent shell"
  STR_MEDUZA: "Medusa"
  STR_MEDUZA_KNOWLEDGEBASE: "RADIATION: 7 R/t{NEWLINE}EFFECT: Grants +10 STRENGTH and +10 MAX HP{NEWLINE}{NEWLINE}Rare artifact made by Burner anomaly. It looks like something fished out of the sea. The core is rock hard, and the 'tentacles' are elastic like rubber."
  STR_GUEST_STALKER: "Guest stalker (rookie)"
  STR_GUEST_STALKER_EXPERIENCED: "Guest stalker (experienced)"
  STR_FUEL_CANISTER: "Fuel canister"
  STR_FUEL_CANISTER_KNOWLEDGEBASE: "Fuel in the Zone is even more expensive than outside. We can use it to make molotov cocktails, or fuel a vehicle, if we can get our hands on one."
  STR_DAMAGED_CHEAP_KEVLAR: "Damaged cheap kevlar"
  STR_DAMAGED_SUNRISE: "Damaged Sunrise armor"
  STR_DAMAGED_HEAVYSUNRISE: "Damaged Heavy Sunrise armor"
  STR_DAMAGED_COBRA: "Damaged Cobra vest"
