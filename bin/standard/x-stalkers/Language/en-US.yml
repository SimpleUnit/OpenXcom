  STR_SIG_S-: "Siege rifle [-S]"
  STR_SIG_GS-: "Siege rifle [-GS]"
  STR_SIG_UC: "Siege rifle article"
  STR_SIG_KNOWLEDGEBASE: "Good overall rifle with no major weaknessess."
  STR_L85: "Longbow rifle"
  STR_L85_G: "Longbow rifle [G]"
  STR_L85_S: "Longbow rifle [S]"
  STR_L85_GS: "Longbow rifle [GS]"
  STR_L85_G+S: "Longbow rifle [GS]"
  STR_L85_S+G: "Longbow rifle [GS]"
